<title>Symbol Desk</title>
<!--
  SignalFlow symbol desk: the maintainer's queue for shared-library submissions.
  Lives at an unlinked path on the deploy site (hidden, not secret: the GitHub token is the lock).
  Approve = add the `approved` label, which runs the symbols repo's publish workflow (validate, upsert
  into library.json, comment, close). Reject = close as not planned, with an optional reason.
  The token is a fine-grained PAT on MattVillis/signalflow-symbols with Issues: read and write,
  kept in this browser's localStorage only; it is sent to api.github.com and nowhere else.
  Everything a submitter controls (titles, bodies, symbol and port names) is escaped before use.
  Source: D:/signalflow/admin/symbol-desk.html; copied into the site repo by hand (build.mjs never touches it).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FAFAF7; --ink: #1A1A18; --panel: #F1F0EB; --rule: #C9C8BF; --muted: #6B6A63;
  --accent: #0E7490; --ok: #2E7D46; --bad: #B3403A; --warn: #B07C22; --gridm: #ECECE6; --gridM: #DDDDD4;
  --card: #FFFFFF;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161614; --ink: #ECEBE4; --panel: #1F1F1C; --rule: #3A3A35; --muted: #9A998F;
    --accent: #3FB3CF; --ok: #5BB377; --bad: #E0756E; --warn: #D9A54A; --gridm: #1C1C19; --gridM: #23231F; --card: #1B1B19;
  }
}
:root[data-theme="dark"] {
  --paper: #161614; --ink: #ECEBE4; --panel: #1F1F1C; --rule: #3A3A35; --muted: #9A998F;
  --accent: #3FB3CF; --ok: #5BB377; --bad: #E0756E; --warn: #D9A54A; --gridm: #1C1C19; --gridM: #23231F; --card: #1B1B19;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font: 400 13px/1.5 var(--mono);
  background-image: linear-gradient(var(--gridM) 1px, transparent 1px), linear-gradient(90deg, var(--gridM) 1px, transparent 1px),
    linear-gradient(var(--gridm) 1px, transparent 1px), linear-gradient(90deg, var(--gridm) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 10px 10px, 10px 10px;
  min-height: 100vh;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; }
body.editing .wrap { max-width: 1760px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1.4px solid var(--ink); padding-bottom: 10px; }
.logo { font: 600 22px var(--cond); letter-spacing: .14em; }
.logo b { color: var(--accent); font-weight: 600; }
.sub { font: 600 10px var(--mono); letter-spacing: .18em; color: var(--muted); }
.who { margin-left: auto; font-size: 11px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
button, .btn {
  font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  border: 1.2px solid var(--ink); background: var(--card); color: var(--ink); padding: 7px 12px; border-radius: 0; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
button:hover:not(:disabled), .btn:hover { background: var(--panel); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--ink); color: var(--paper); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ok { border-color: var(--ok); color: var(--ok); }
button.ok.primary { background: var(--ok); color: #fff; }
button.bad { border-color: var(--bad); color: var(--bad); }
button.link { border: none; background: none; padding: 2px 0; color: var(--muted); text-decoration: underline; letter-spacing: .04em; text-transform: none; font-weight: 500; }
input, textarea {
  font: 400 12px var(--mono); color: var(--ink); background: var(--card); border: 1.2px solid var(--rule); padding: 8px 10px; width: 100%; border-radius: 0;
}
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
.tabs { display: flex; gap: 0; margin: 18px 0 14px; flex-wrap: wrap; }
.tabs button { border-right-width: 0; }
.tabs button:last-child { border-right-width: 1.2px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 2px; background: var(--accent); color: #fff; font-size: 10px; text-align: center; }
.tabs button[aria-pressed="true"] .count { background: var(--paper); color: var(--ink); }
.panel { background: var(--card); border: 1.2px solid var(--ink); padding: 18px; }
.note { font-size: 11.5px; color: var(--muted); }
.note a { color: var(--accent); }
.empty { text-align: center; padding: 50px 16px; color: var(--muted); border: 1.2px dashed var(--rule); background: var(--card); }
.empty .big { font: 600 22px var(--cond); letter-spacing: .1em; color: var(--ink); margin-bottom: 4px; }
.card { background: var(--card); border: 1.2px solid var(--ink); margin-bottom: 16px; }
.card-h { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.card-h .t { font: 600 18px var(--cond); letter-spacing: .06em; line-height: 1.15; }
.card-h .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.card-h .meta a { color: var(--muted); }
.chips { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font: 600 9.5px var(--mono); letter-spacing: .12em; padding: 3px 7px; border: 1.2px solid currentColor; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); } .chip.info { color: var(--accent); } .chip.mute { color: var(--muted); }
.card-b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.prev { padding: 14px; border-right: 1px solid var(--rule); background: var(--paper); display: flex; align-items: flex-start; justify-content: center; overflow: auto; max-height: 80vh; }
.prev svg { max-width: 100%; height: auto; }
.facts { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.facts dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 11.5px; }
.facts dt { color: var(--muted); font-size: 9.5px; letter-spacing: .14em; padding-top: 2px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.msgs { display: flex; flex-direction: column; gap: 6px; }
.msg { font-size: 11.5px; padding: 7px 9px; border-left: 3px solid var(--rule); background: var(--panel); overflow-wrap: anywhere; }
.msg.ok { border-color: var(--ok); } .msg.bad { border-color: var(--bad); } .msg.warn { border-color: var(--warn); }
details summary { cursor: pointer; font: 600 10px var(--mono); letter-spacing: .14em; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 11px; margin-top: 6px; }
th { text-align: left; font: 600 9px var(--mono); letter-spacing: .12em; color: var(--muted); border-bottom: 1px solid var(--ink); padding: 3px 6px 3px 0; }
td { border-bottom: 1px solid var(--rule); padding: 3px 6px 3px 0; }
pre { font: 400 10.5px var(--mono); background: var(--panel); padding: 8px; overflow: auto; max-height: 220px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-top: 1px solid var(--rule); align-items: center; background: var(--panel); }
.actions .grow { flex: 1; }
.reject { padding: 12px 14px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
.status { font-size: 11.5px; font-weight: 600; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); } .status.busy { color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list { background: var(--card); border: 1.2px solid var(--ink); }
.li { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; font-size: 12px; }
.li:last-child { border-bottom: none; }
.li .n { font: 600 15px var(--cond); letter-spacing: .05em; }
.li .m { color: var(--muted); font-size: 11px; }
.li .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.err { color: var(--bad); font-size: 12px; margin-top: 8px; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
.ed { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ed .top { display: grid; grid-template-columns: 1fr 140px 80px; gap: 6px; }
.ed label { font: 600 9px var(--mono); letter-spacing: .14em; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.ed input, .ed select { padding: 5px 6px; font-size: 11px; }
select { font: 400 11px var(--mono); color: var(--ink); background: var(--card); border: 1.2px solid var(--rule); padding: 5px 4px; border-radius: 0; min-width: 0; }
select:focus { outline: none; border-color: var(--accent); }
.card-b.edit { grid-template-columns: minmax(240px, 28%) minmax(0, 1fr); align-items: start; }
.card-b.edit .prev { position: sticky; top: 0; max-height: 100vh; align-self: start; }
.sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.side h4 { margin: 0 0 4px; font: 600 10px var(--mono); letter-spacing: .16em; display: flex; align-items: center; gap: 8px; border-bottom: 1.2px solid var(--ink); padding-bottom: 4px; }
.side h4 span { color: var(--muted); font-weight: 500; letter-spacing: .06em; }
.side h4 button { margin-left: auto; padding: 3px 8px; font-size: 9.5px; }
.ports { display: flex; flex-direction: column; gap: 3px; }
.actions.sticky { position: sticky; bottom: 0; z-index: 3; box-shadow: 0 -6px 14px -10px rgba(0,0,0,.35); }
@media (max-width: 1400px) { .sides { grid-template-columns: 1fr; } }
.prow { display: grid; grid-template-columns: 16px 24px minmax(110px, 1fr) 58px 96px 112px 24px 24px; grid-template-areas: "mv gap lab dir sig conn flip x"; gap: 4px; align-items: center; }
.prow > :nth-child(1) { grid-area: mv; } .prow > :nth-child(2) { grid-area: gap; } .prow > :nth-child(3) { grid-area: lab; } .prow > :nth-child(4) { grid-area: dir; }
.prow > :nth-child(5) { grid-area: sig; } .prow > :nth-child(6) { grid-area: conn; } .prow > :nth-child(7) { grid-area: flip; } .prow > :nth-child(8) { grid-area: x; }
.prow .flip { padding: 0; height: 26px; border: 1.2px solid var(--rule); background: var(--card); font-size: 12px; letter-spacing: 0; color: var(--muted); }
.prow .flip:hover { color: var(--ink); border-color: var(--ink); }
.ed input, .ed select { font-size: 12px; padding: 6px 6px; }
.prow .mv button { font-size: 10px; line-height: 12px; }
.prow.head { font: 600 8px var(--mono); letter-spacing: .12em; color: var(--muted); position: sticky; top: 0; background: var(--card); z-index: 1; padding-bottom: 2px; }
.prow .mv { display: flex; flex-direction: column; }
.prow .mv button, .prow .x, .prow .gap { padding: 0; border: none; background: none; font-size: 9px; line-height: 10px; color: var(--ink); letter-spacing: 0; }
.prow .mv button:disabled { color: var(--rule); }
.prow .gap { border: 1.2px solid var(--rule); height: 26px; font-size: 10px; color: var(--muted); }
.prow .gap.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.prow .x { font-size: 16px; color: var(--muted); height: 26px; }
.prow .x:hover { color: var(--bad); }
.prow select.unk, .ed select.unk { border-color: var(--warn); color: var(--warn); }
.prow input.chg, .prow select.chg { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
footer { margin-top: 28px; font-size: 10.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
footer a { color: var(--muted); }
@media (max-width: 720px) {
  .card-b.edit { grid-template-columns: 1fr; }
  .card-b.edit .prev { position: static; max-height: 340px; }
  .prow { grid-template-columns: 16px 26px repeat(3, minmax(0, 1fr)) 26px 26px; grid-template-areas: "mv gap lab lab lab flip x" "mv dir dir sig conn conn conn"; padding-bottom: 5px; border-bottom: 1px solid var(--rule); }
  .prow select { font-size: 10px; padding: 5px 0 5px 2px; }
  .prow.head { display: none; }
  .ed .top { grid-template-columns: 1fr 1fr; } .ed .top label:first-child { grid-column: 1 / -1; }
  .card-b { grid-template-columns: 1fr; }
  .prev { border-right: none; border-bottom: 1px solid var(--rule); max-height: 380px; }
  .chips { margin-left: 0; justify-content: flex-start; width: 100%; }
  .who { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SIGNAL<b>FLOW</b></div>
    <div class="sub">SYMBOL DESK</div>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
  <footer>
    <a href="https://github.com/MattVillis/signalflow-symbols/issues" target="_blank" rel="noopener">Symbol issues on GitHub</a>
    <a href="https://github.com/MattVillis/signalflow-symbols/blob/main/library.json" target="_blank" rel="noopener">library.json</a>
    <a href="https://github.com/MattVillis/signalflow-symbols/actions" target="_blank" rel="noopener">Workflow runs</a>
    <a href="https://mattvillis.github.io/signalflow/" target="_blank" rel="noopener">SignalFlow</a>
  </footer>
</div>
<script>
(() => {
  const OWNER = "MattVillis", REPO = "signalflow-symbols", API = "https://api.github.com";
  const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/`;
  const MARK = "Symbol submission from SignalFlow";
  const KEY = "sf_desk_token";
  /* Copied from src/App.jsx (CONN, CATEGORIES) on 2026-10-15. The app blanks a connector its catalogue does
     not list, so the desk warns about one and the editor offers only these. Refresh both when the app's change. */
  const CONN = {
    video: ["HDMI", "DP", "12G SDI", "6G SDI", "3G SDI", "HD SDI", "DVI", "BNC", "HD-BNC", "RJ45", "SFP+", "SFP28", "USB-C"],
    fiber: ["OPTICALCON DUO", "OPTICALCON QUAD", "LC", "SC", "SFP", "SFP+", "SFP28", "QSFP+", "QSFP28", "SM FIBER", "MM FIBER"],
    network: ["RJ45", "ETHERCON", "SFP", "SFP+", "SFP28", "QSFP+", "QSFP28", "RJ45 10G"],
    audio: ["XLR", "TRS", "AES3", "MADI", "ANALOG", "SPDIF", "DIN 1.0/2.3", "RJ45", "ETHERCON", "USB-A", "USB-C"],
    control: ["DMX 5PIN", "DMX 3PIN", "RS-232", "GPIO", "MIDI", "LTC", "XLR", "BNC", "D-SUB 15", "D-SUB 26", "USB-A", "USB-B", "USB-C", "OCULINK"],
    power: ["POWERCON", "TRUE1", "IEC C13", "IEC C14", "IEC C19", "IEC C20", "DC", "XLR 4-PIN", "USB-C"],
  };
  const CATEGORIES = ["Servers", "Computers", "Processing", "LED", "Extenders", "KVM", "Display", "Cameras", "Network", "Audio", "Control", "Lighting", "Power", "Custom"];
  const SIGNALS = Object.keys(CONN), NAME_MAX = 36, LABEL_MAX = 24;   // = the app's NAME_MAX / PORT_LABEL_MAX
  const clone = o => JSON.parse(JSON.stringify(o));
  // catalogue warnings: things the validator allows but the app would not draw as intended
  function catalogueWarnings(sym) {
    const w = [];
    if (sym.category && !CATEGORIES.includes(sym.category)) w.push(`Category "${sym.category}" is not one of the app's, so the symbol files under Custom.`);
    const bad = (sym.ports || []).filter(p => p.conn && SIGNALS.includes(p.signal) && !CONN[p.signal].includes(p.conn));
    if (bad.length) w.push(`${bad.length} connector${bad.length > 1 ? "s" : ""} the app doesn't know for that signal, which will show blank: ${[...new Set(bad.map(p => p.signal + " " + p.conn))].slice(0, 4).join(", ")}${bad.length > 4 ? "…" : ""}.`);
    return w;
  }
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get: () => { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } }, set: v => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} } };
  const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000; if (s < 90) return "just now"; if (s < 5400) return Math.round(s / 60) + " min ago"; if (s < 129600) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " days ago"; };

  let token = store.get(), me = null, lib = null, L = null, tab = "queue", builtins = null;
  const state = { queue: [], done: [], busy: {}, open: {}, rejecting: {}, status: {}, edit: {}, saved: {} };

  async function gh(path, opt = {}) {
    const r = await fetch(API + path, { cache: "no-store", ...opt, headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, ...(opt.body ? { "Content-Type": "application/json" } : {}) } });
    if (r.status === 204) return null;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.message || `GitHub said ${r.status}`); e.status = r.status; throw e; }
    return j;
  }
  // the repo's own validator (scripts/symbol.js, CommonJS) so this page judges exactly as the workflows do
  async function loadValidator() {
    const src = await (await fetch(RAW + "scripts/symbol.js", { cache: "no-store" })).text();
    const module = { exports: {} };
    new Function("module", "exports", src)(module, module.exports);
    return module.exports;
  }
  // the app's built-in symbols: build.mjs --deploy writes /signalflow/builtins.json, one level up from the desk
  async function loadBuiltins() {
    try { const r = await fetch(new URL("../builtins.json", location.href) + "?x=" + Date.now(), { cache: "no-store" }); if (!r.ok) return null; return (await r.json()).symbols || null; }
    catch { return null; }
  }
  async function loadLibrary() {
    const r = await fetch(RAW + "library.json?x=" + Date.now(), { cache: "no-store" });
    return (await r.json()).library || [];
  }
  const isSubmission = i => !i.pull_request && (/^\[symbol\]/i.test(i.title) || (i.body || "").includes(MARK) || i.labels.some(l => l.name === "symbol"));

  function analyse(issue) {
    const a = { issue, sym: null, errs: [], parseErr: null, labels: issue.labels.map(l => l.name) };
    try { const raw = L.parseSubmission(issue.body); a.errs = L.validate(raw); if (!a.errs.length) a.sym = L.normalise(raw); else a.raw = raw; }
    catch (e) { a.parseErr = e.message; }
    const s = a.sym || a.raw;
    a.warns = s ? catalogueWarnings(s) : [];
    if (s && lib) {
      a.sameId = lib.find(d => d.id === s.id);
    }
    return a;
  }

  /* ---------- duplicate check ----------
     Names compared with case and punctuation stripped. EXACT = the same name once stripped. CLOSE = one name
     contains the other (6+ characters), they share a model number (a token with a digit, 5+ characters once
     stripped, so "8X8" or "12G" alone never match), most of the shorter name's words appear in the other (a word
     cut short by the 36-character name limit still counts: BIDIRECTI ~ BIDIRECTIONAL), or they are a typo apart
     (1-2 characters; wider than that flagged M4350-24X4V against M4250-26G4F, which are different boxes). Compared with
     the built-ins, the shared library (a symbol with the SAME id is an update, not a duplicate) and the other
     waiting submissions, since two people may send the same box. */
  const norm = v => String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const words = v => String(v || "").toUpperCase().split(/[^A-Z0-9]+/).filter(w => w.length >= 3);
  const wordHit = (w, list) => list.some(x => x === w || (Math.min(w.length, x.length) >= 5 && (x.startsWith(w) || w.startsWith(x))));
  const models = v => String(v || "").toUpperCase().split(/[\s/]+/).map(norm).filter(t => t.length >= 5 && /\d/.test(t));
  function lev(a, b) {
    if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  function findDupes(sym, selfNumber) {
    if (!sym?.name) return { exact: [], close: [] };
    const me = norm(sym.name), myModels = new Set(models(sym.name));
    const pool = [
      ...(builtins || []).map(b => ({ where: "built-in", name: b.name, ports: b.ports })),
      ...(lib || []).filter(d => d.id !== sym.id).map(d => ({ where: "shared library", name: d.name, ports: expand(d).length })),
      ...state.queue.filter(a => a.issue.number !== selfNumber && (a.sym || a.raw)?.name).map(a => ({ where: `waiting #${a.issue.number}`, name: (a.sym || a.raw).name, ports: expand(a.sym || a.raw).length || 0 })),
    ];
    const exact = [], close = [];
    pool.forEach(c => {
      const them = norm(c.name); if (!them || !me) return;
      if (them === me) { exact.push(c); return; }
      const short = Math.min(me.length, them.length);
      let score = 0, why = "";
      if (short >= 6 && (me.includes(them) || them.includes(me))) { score = 3; why = "one name contains the other"; }

    const base = clone(src);
    base.ports = (base.ports || []).map((p, i) => ({ id: typeof p.id === "string" && p.id ? p.id : "p" + i, label: String(p.label || ""), side: p.side, dir: p.dir, signal: p.signal, conn: p.conn || "", ...(p.gap ? { gap: true } : {}) }));
    base.name = String(base.name || ""); base.category = base.category || "Custom"; base.width = +base.width || 170; base.rev = Math.max(1, +base.rev || 1);
    state.edit[n] = { orig: clone(base), sym: base };
    renderCard(n);
  }
  function onEdit(el, live) {
    const n = +el.dataset.n, i = +el.dataset.i, ed = state.edit[n]; if (!ed) return;
    const s = ed.sym, k = el.dataset.e, p = s.ports[i];
    if (k === "name") { s.name = el.value.toUpperCase().slice(0, NAME_MAX); if (el.value !== s.name) el.value = s.name; return liveUpdate(n); }
    if (k === "width") { const w = Math.round(+el.value); if (w >= 130 && w <= 280) { s.width = w; liveUpdate(n); } return; }
    if (k === "label") { p.label = el.value.toUpperCase().slice(0, LABEL_MAX); if (el.value !== p.label) { const c = el.selectionStart; el.value = p.label; el.setSelectionRange(c, c); } return liveUpdate(n); }
    if (live) return;
    if (k === "category") s.category = el.value;
    else if (k === "side" || k === "dir") p[k] = el.value;
    else if (k === "signal") { p.signal = el.value; if (p.conn && !(CONN[p.signal] || []).includes(p.conn)) p.conn = ""; }
    else if (k === "conn") p.conn = el.value;
    renderCard(n);
  }
  function onEditClick(b) {
    const n = +b.dataset.n, i = +b.dataset.i, ed = state.edit[n]; if (!ed) return;
    const ps = ed.sym.ports, k = b.dataset.e;
    const j = +b.dataset.j;
    if (k === "swap" && j >= 0) [ps[i], ps[j]] = [ps[j], ps[i]];
    else if (k === "flip") ps[i].side = ps[i].side === "right" ? "left" : "right";
    else if (k === "gap") { if (ps[i].gap) delete ps[i].gap; else ps[i].gap = true; }
    else if (k === "del") ps.splice(i, 1);
    else if (k === "add") {
      const used = new Set(ps.map(p => p.id)); let j = ps.length; while (used.has("p" + j)) j++;
      const side = b.dataset.side || "right", mine = ps.filter(p => p.side === side);
      const last = mine[mine.length - 1] || (side === "left" ? { dir: "in", signal: "video" } : { dir: "out", signal: "video" });
      ps.push({ id: "p" + j, label: `PORT ${ps.length + 1}`, side, dir: last.dir, signal: last.signal, conn: last.conn || "" });
    }
    else if (k === "revert") ed.sym = clone(ed.orig);
    renderCard(n);
    if (k === "add") { const rows = document.querySelectorAll(`#i${n} .side:${b.dataset.side === "left" ? "first" : "last"}-child .prow:not(.head)`); const r = rows[rows.length - 1]; r?.scrollIntoView({ block: "center" }); r?.querySelector("input")?.select(); }
  }
  async function saveEdit(n) {
    const a = state.queue.find(x => x.issue.number === n), ed = state.edit[n]; if (!a || !ed) return;
    const changes = diffSym(ed.orig, ed.sym);
    if (L.validate(ed.sym).length || !changes.length) return;
    setStatus(n, "busy", "Saving to the issue…");
    try {
      const fresh = await gh(`/repos/${OWNER}/${REPO}/issues/${n}`);
      // keep the FIRST original: a second edit must not fold the first edit away as "original"
      const prior = /<details><summary>Original submission<\/summary>[\s\S]*?<\/details>/.exec(fresh.body || "");
      const origJson = prior ? null : (() => { try { return JSON.stringify(L.parseSubmission(fresh.body)); } catch { return fresh.body || ""; } })();
      const T3 = "\x60\x60\x60";
      const body = `${MARK}.\n\n${T3}json\n${JSON.stringify(ed.sym)}\n${T3}\n\n_Edited by @${me.login} before approval._\n\n` +
        (prior ? prior[0] : `<details><summary>Original submission</summary>\n\n${T3}text\n${origJson}\n${T3}\n</details>`) + "\n";
      // GitHub's issue LIST can serve the old body for a minute after an edit, so the issue the PATCH returns
      // is kept and used until the list's updated_at catches up (a saved edit used to vanish on refresh)
      state.saved[n] = await gh(`/repos/${OWNER}/${REPO}/issues/${n}`, { method: "PATCH", body: JSON.stringify({ body }) });
      await gh(`/repos/${OWNER}/${REPO}/issues/${n}/comments`, { method: "POST", body: JSON.stringify({ body: `✎ Edited before approval:\n\n${changes.map(c => "- " + c).join("\n")}\n\nThe original is kept at the bottom of the issue.` }) });
      delete state.edit[n];
      setStatus(n, "ok", "Saved. The checker re-runs on GitHub; approve when you're happy.");
      await refresh(); render();
      setTimeout(() => { if (state.status[n]?.kind === "ok") { delete state.status[n]; render(); } }, 6000);
    } catch (e) { setStatus(n, "bad", e.status === 403 || e.status === 404 ? "The token can't edit issues. Give it Issues: Read and write." : e.message); }
  }

  function render() {
    markEditing();
    renderWho();
    if (!token) return renderLogin();
    if (!L) { $("#app").innerHTML = `<div class="empty"><span class="spin"></span> Loading…</div>`; return; }
    let body = "";
    if (tab === "queue") {
      const bnote = builtins ? "" : `<div class="msg warn" style="margin-bottom:12px">The built-in symbol list (builtins.json) couldn't be loaded, so duplicates of built-ins aren't checked. It's published with every app deploy.</div>`;
      body = bnote + (state.queue.length ? state.queue.map(cardHtml).join("")
        : `<div class="empty"><div class="big">NOTHING WAITING</div>No open symbol submissions. New ones also email you, since you're watching the repo.</div>`);
    } else if (tab === "done") {
      body = state.done.length ? `<div class="list">${state.done.map(i => {
        const approved = i.labels.some(l => l.name === "approved");
        return `<div class="li"><span class="chip ${approved ? "ok" : "mute"}">${approved ? "PUBLISHED" : "REJECTED"}</span>
          <span class="n">${esc(i.title.replace(/^\[symbol\]\s*/i, ""))}</span><span class="m">#${i.number} · ${esc(i.user.login)} · ${ago(i.closed_at)}</span>
          <span class="r"><a class="btn" href="${esc(i.html_url)}" target="_blank" rel="noopener">Open ↗</a></span></div>`;
      }).join("")}</div>` : `<div class="empty">Nothing decided yet.</div>`;
    } else {
      body = lib?.length ? `<div class="list">${lib.map(d => `<div class="li"><span class="n">${esc(d.name)}</span>
        <span class="m">${esc(d.category)} · ${expand(d).length} ports · rev ${esc(d.rev)}</span></div>`).join("")}</div>
        <p class="note">To change or remove one of these, edit library.json in the repo. Every app picks up changes on its next sync (within 30 minutes).</p>`
        : `<div class="empty">The shared library is empty.</div>`;
    }
    $("#app").innerHTML = tabsHtml() + body;
  }

  /* ---------- actions ---------- */
  async function refresh() {
    [lib, L, builtins] = await Promise.all([loadLibrary(), L || loadValidator(), builtins ? Promise.resolve(builtins) : loadBuiltins()]);
    const open = await gh(`/repos/${OWNER}/${REPO}/issues?state=open&per_page=100&sort=created&direction=asc`);
    const issues = open.map(i => { const sv = state.saved[i.number]; if (!sv) return i;
      if (new Date(i.updated_at) >= new Date(sv.updated_at) && i.body === sv.body) { delete state.saved[i.number]; return i; }
      return { ...i, body: sv.body, title: sv.title, updated_at: sv.updated_at }; });
    state.queue = issues.filter(isSubmission).map(analyse);
    const closed = await gh(`/repos/${OWNER}/${REPO}/issues?state=closed&per_page=30&sort=updated&direction=desc`);
    state.done = closed.filter(isSubmission);
  }
  async function boot() {
    $("#app").innerHTML = `<div class="empty"><span class="spin"></span> Connecting…</div>`;
    try {
      me = await gh("/user");
      const perm = await gh(`/repos/${OWNER}/${REPO}`).catch(() => null);
      if (!perm) throw new Error(`This token can't see ${OWNER}/${REPO}. Give it access to that repository.`);
      store.set(token);
      await refresh();
      render();
    } catch (e) {
      me = null; L = null;
      if (e.status === 401) { store.set(""); token = ""; renderWho(); return renderLogin("GitHub didn't accept that token. Check it was copied in full and hasn't expired."); }
      store.set(""); token = ""; renderWho(); renderLogin(e.message);
    }
  }
  const setStatus = (n, kind, text, extra = {}) => { state.status[n] = { kind, text, busy: kind === "busy", ...extra }; if (state.edit[n]) renderCard(n); else render(); };

  /* Adding a label the issue ALREADY has fires no "labeled" event, so a submission whose publish failed (still
     open, still labelled approved) would never re-run: take the label off first, then put it back. */
  async function approve(n) {
    const a = state.queue.find(x => x.issue.number === n);
    setStatus(n, "busy", "Adding the approved label…");
    try {
      if (a?.labels.includes("approved")) {
        await gh(`/repos/${OWNER}/${REPO}/issues/${n}/labels/approved`, { method: "DELETE" }).catch(e => { if (e.status !== 404) throw e; });
        a.labels = a.labels.filter(l => l !== "approved");
      }
      await gh(`/repos/${OWNER}/${REPO}/issues/${n}/labels`, { method: "POST", body: JSON.stringify({ labels: ["approved"] }) });
      setStatus(n, "busy", "Publishing… (the workflow takes about 30 s)");
      const t0 = Date.now();
      while (Date.now() - t0 < 180000) {
        await new Promise(r => setTimeout(r, 5000));
        const [iss, comments] = await Promise.all([gh(`/repos/${OWNER}/${REPO}/issues/${n}`), gh(`/repos/${OWNER}/${REPO}/issues/${n}/comments?per_page=100`)]);
        const fail = comments.find(c => /Not published/.test(c.body) && new Date(c.created_at) >= new Date(t0 - 5000));
        if (fail) { if (a && !a.labels.includes("approved")) a.labels.push("approved"); setStatus(n, "bad", "Not published: " + fail.body.replace(/^.*?—\s*/, "").slice(0, 200)); return; }
        if (iss.state === "closed") {
          setStatus(n, "ok", "✓ Published to library.json · apps get it within 30 min", { done: true });
          setTimeout(async () => { delete state.status[n]; await refresh(); render(); }, 4000);
          return;
        }
      }
      if (a && !a.labels.includes("approved")) a.labels.push("approved");
      setStatus(n, "bad", "Still not published after 3 minutes. Check the workflow runs (link at the bottom), or retry.");
    } catch (e) { setStatus(n, "bad", e.status === 403 || e.status === 404 ? "The token can't edit issues. Give it Issues: Read and write." : e.message); }
  }
  async function reject(n) {
    const why = ($(`#why${n}`)?.value || "").trim();
    state.rejecting[n] = false;
    setStatus(n, "busy", "Closing…");
    try {
      if (why) await gh(`/repos/${OWNER}/${REPO}/issues/${n}/comments`, { method: "POST", body: JSON.stringify({ body: `Not added to the shared library this time.\n\n${why}` }) });
      await gh(`/repos/${OWNER}/${REPO}/issues/${n}`, { method: "PATCH", body: JSON.stringify({ state: "closed", state_reason: "not_planned" }) });
      setStatus(n, "ok", "Rejected and closed", { done: true });
      setTimeout(async () => { delete state.status[n]; await refresh(); render(); }, 2500);
    } catch (e) { setStatus(n, "bad", e.status === 403 || e.status === 404 ? "The token can't edit issues. Give it Issues: Read and write." : e.message); }
  }
  document.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tab) { tab = b.dataset.tab; render(); return; }
    if (b.id === "refresh") { b.disabled = true; b.innerHTML = '<span class="spin"></span> Refresh'; try { await refresh(); } catch (err) { alert(err.message); } render(); return; }
    if (b.dataset.e) { onEditClick(b); return; }
    const n = +b.dataset.n;
    if (b.dataset.act === "edit") startEdit(n);
    if (b.dataset.act === "edit-cancel") { delete state.edit[n]; delete state.status[n]; renderCard(n); }
    if (b.dataset.act === "edit-save") saveEdit(n);
    if (b.dataset.act === "approve") approve(n);
    if (b.dataset.act === "reject") { state.rejecting[n] = true; render(); $(`#why${n}`)?.focus(); }
    if (b.dataset.act === "reject-cancel") { state.rejecting[n] = false; render(); }
    if (b.dataset.act === "reject-go") reject(n);
  });
  document.addEventListener("input", e => { const el = e.target.closest("[data-e]"); if (el) onEdit(el, true); });
  document.addEventListener("change", e => { const el = e.target.closest("[data-e]"); if (el && el.tagName === "SELECT") onEdit(el, false); });
  // a quiet re-check while the tab is open, so a new submission shows up on its own
  setInterval(async () => { if (token && L && document.visibilityState === "visible" && !Object.values(state.status).some(s => s.busy) && !Object.values(state.rejecting).some(Boolean) && !Object.keys(state.edit).length) { try { await refresh(); render(); } catch {} } }, 120000);

  if (token) boot(); else render();
})();
</script>
</body>
</html>
