<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Symbol Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1A1A18">
<!--
  SignalFlow symbol desk: the maintainer's queue for shared-library submissions.
  Lives at an unlinked path on the deploy site (hidden, not secret: the GitHub token is the lock).
  Approve = add the `approved` label, which runs the symbols repo's publish workflow (validate, upsert
  into library.json, comment, close). Reject = close as not planned, with an optional reason.
  The token is a fine-grained PAT on MattVillis/signalflow-symbols with Issues: read and write,
  kept in this browser's localStorage only; it is sent to api.github.com and nowhere else.
  Everything a submitter controls (titles, bodies, symbol and port names) is escaped before use.
  Source: D:/signalflow/admin/symbol-desk.html; copied into the site repo by hand (build.mjs never touches it).
  Installable as a phone app (Chrome > Add to home screen): admin/desk-pwa/ holds manifest.webmanifest, sw.js and the
  icons, copied next to index.html. "Pair phone" shows a QR of this page with #pair=<token>; the phone stores the
  token and strips the hash, so it never has to be typed on a phone keyboard.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FAFAF7; --ink: #1A1A18; --panel: #F1F0EB; --rule: #C9C8BF; --muted: #6B6A63;
  --accent: #0E7490; --ok: #2E7D46; --bad: #B3403A; --warn: #B07C22; --gridm: #ECECE6; --gridM: #DDDDD4;
  --card: #FFFFFF;
  /* class colours = the app legend; dark mode lifts them so they read on the dark paper */
  --c-video: var(--ink); --c-audio: #0E7490; --c-lighting: #7A4BA0; --c-network: #2E7D46; --c-control: #8A8A82; --c-power: #B3403A;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161614; --ink: #ECEBE4; --panel: #1F1F1C; --rule: #3A3A35; --muted: #9A998F;
    --accent: #3FB3CF; --ok: #5BB377; --bad: #E0756E; --warn: #D9A54A; --gridm: #1C1C19; --gridM: #23231F; --card: #1B1B19;
    --c-audio: #3FB3CF; --c-lighting: #B58CE0; --c-network: #5BB377; --c-control: #A9A89E; --c-power: #E0756E;
  }
}
:root[data-theme="dark"] {
  --paper: #161614; --ink: #ECEBE4; --panel: #1F1F1C; --rule: #3A3A35; --muted: #9A998F;
  --accent: #3FB3CF; --ok: #5BB377; --bad: #E0756E; --warn: #D9A54A; --gridm: #1C1C19; --gridM: #23231F; --card: #1B1B19;
    --c-audio: #3FB3CF; --c-lighting: #B58CE0; --c-network: #5BB377; --c-control: #A9A89E; --c-power: #E0756E;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font: 400 13px/1.5 var(--mono);
  background-image: linear-gradient(var(--gridM) 1px, transparent 1px), linear-gradient(90deg, var(--gridM) 1px, transparent 1px),
    linear-gradient(var(--gridm) 1px, transparent 1px), linear-gradient(90deg, var(--gridm) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 10px 10px, 10px 10px;
  min-height: 100vh;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; }
body.editing .wrap { max-width: 1760px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1.4px solid var(--ink); padding-bottom: 10px; }
.logo { font: 600 22px var(--cond); letter-spacing: .14em; }
.logo b { color: var(--accent); font-weight: 600; }
.sub { font: 600 10px var(--mono); letter-spacing: .18em; color: var(--muted); }
.who { margin-left: auto; font-size: 11px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
button, .btn {
  font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  border: 1.2px solid var(--ink); background: var(--card); color: var(--ink); padding: 7px 12px; border-radius: 0; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
button:hover:not(:disabled), .btn:hover { background: var(--panel); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--ink); color: var(--paper); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.ok { border-color: var(--ok); color: var(--ok); }
button.ok.primary { background: var(--ok); color: #fff; }
button.bad { border-color: var(--bad); color: var(--bad); }
button.link { border: none; background: none; padding: 2px 0; color: var(--muted); text-decoration: underline; letter-spacing: .04em; text-transform: none; font-weight: 500; }
input, textarea {
  font: 400 12px var(--mono); color: var(--ink); background: var(--card); border: 1.2px solid var(--rule); padding: 8px 10px; width: 100%; border-radius: 0;
}
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
.tabs { display: flex; gap: 0; margin: 18px 0 14px; flex-wrap: wrap; }
.tabs button { border-right-width: 0; }
.tabs button:last-child { border-right-width: 1.2px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 2px; background: var(--accent); color: #fff; font-size: 10px; text-align: center; }
.tabs button[aria-pressed="true"] .count { background: var(--paper); color: var(--ink); }
.panel { background: var(--card); border: 1.2px solid var(--ink); padding: 18px; }
.note { font-size: 11.5px; color: var(--muted); }
.note a { color: var(--accent); }
.empty { text-align: center; padding: 50px 16px; color: var(--muted); border: 1.2px dashed var(--rule); background: var(--card); }
.empty .big { font: 600 22px var(--cond); letter-spacing: .1em; color: var(--ink); margin-bottom: 4px; }
.card { background: var(--card); border: 1.2px solid var(--ink); margin-bottom: 16px; }
.card-h { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.card-h .t { font: 600 18px var(--cond); letter-spacing: .06em; line-height: 1.15; }
.card-h .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.card-h .meta a { color: var(--muted); }
.chips { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font: 600 9.5px var(--mono); letter-spacing: .12em; padding: 3px 7px; border: 1.2px solid currentColor; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); } .chip.info { color: var(--accent); } .chip.mute { color: var(--muted); }
.card-b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.prev { padding: 14px; border-right: 1px solid var(--rule); background: var(--paper); display: flex; align-items: flex-start; justify-content: center; overflow: auto; max-height: 80vh; }
.prev svg { max-width: 100%; height: auto; }
.facts { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.facts dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 11.5px; }
.facts dt { color: var(--muted); font-size: 9.5px; letter-spacing: .14em; padding-top: 2px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.msgs { display: flex; flex-direction: column; gap: 6px; }
.msg { font-size: 11.5px; padding: 7px 9px; border-left: 3px solid var(--rule); background: var(--panel); overflow-wrap: anywhere; }
.msg.ok { border-color: var(--ok); } .msg.bad { border-color: var(--bad); } .msg.warn { border-color: var(--warn); }
details summary { cursor: pointer; font: 600 10px var(--mono); letter-spacing: .14em; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 11px; margin-top: 6px; }
th { text-align: left; font: 600 9px var(--mono); letter-spacing: .12em; color: var(--muted); border-bottom: 1px solid var(--ink); padding: 3px 6px 3px 0; }
td { border-bottom: 1px solid var(--rule); padding: 3px 6px 3px 0; }
pre { font: 400 10.5px var(--mono); background: var(--panel); padding: 8px; overflow: auto; max-height: 220px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-top: 1px solid var(--rule); align-items: center; background: var(--panel); }
.actions .grow { flex: 1; }
.reject { padding: 12px 14px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
.status { font-size: 11.5px; font-weight: 600; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); } .status.busy { color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list { background: var(--card); border: 1.2px solid var(--ink); }
.li { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; font-size: 12px; }
.li:last-child { border-bottom: none; }
.li .n { font: 600 15px var(--cond); letter-spacing: .05em; }
.li .m { color: var(--muted); font-size: 11px; }
.li .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.err { color: var(--bad); font-size: 12px; margin-top: 8px; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
.ed { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ed .top { display: grid; grid-template-columns: 1fr 140px 80px; gap: 6px; }
.ed label { font: 600 9px var(--mono); letter-spacing: .14em; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.ed input, .ed select { padding: 5px 6px; font-size: 11px; }
select { font: 400 11px var(--mono); color: var(--ink); background: var(--card); border: 1.2px solid var(--rule); padding: 5px 4px; border-radius: 0; min-width: 0; }
select:focus { outline: none; border-color: var(--accent); }
.card-b.edit { grid-template-columns: minmax(240px, 28%) minmax(0, 1fr); align-items: start; }
.card-b.edit .prev { position: sticky; top: 0; max-height: 100vh; align-self: start; }
.sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.side h4 { margin: 0 0 4px; font: 600 10px var(--mono); letter-spacing: .16em; display: flex; align-items: center; gap: 8px; border-bottom: 1.2px solid var(--ink); padding-bottom: 4px; }
.side h4 span { color: var(--muted); font-weight: 500; letter-spacing: .06em; }
.side h4 button { margin-left: auto; padding: 3px 8px; font-size: 9.5px; }
.ports { display: flex; flex-direction: column; gap: 3px; }
.actions.sticky { position: sticky; bottom: 0; z-index: 3; box-shadow: 0 -6px 14px -10px rgba(0,0,0,.35); }
@media (max-width: 1400px) { .sides { grid-template-columns: 1fr; } }
.prow { display: grid; grid-template-columns: 16px 24px minmax(110px, 1fr) 58px 96px 112px 24px 24px; grid-template-areas: "mv gap lab dir sig conn flip x"; gap: 4px; align-items: center; }
.prow > :nth-child(1) { grid-area: mv; } .prow > :nth-child(2) { grid-area: gap; } .prow > :nth-child(3) { grid-area: lab; } .prow > :nth-child(4) { grid-area: dir; }
.prow > :nth-child(5) { grid-area: sig; } .prow > :nth-child(6) { grid-area: conn; } .prow > :nth-child(7) { grid-area: flip; } .prow > :nth-child(8) { grid-area: x; }
.prow .flip { padding: 0; height: 26px; border: 1.2px solid var(--rule); background: var(--card); font-size: 12px; letter-spacing: 0; color: var(--muted); }
.prow .flip:hover { color: var(--ink); border-color: var(--ink); }
.ed input, .ed select { font-size: 12px; padding: 6px 6px; }
.prow .mv button { font-size: 10px; line-height: 12px; }
.prow.head { font: 600 8px var(--mono); letter-spacing: .12em; color: var(--muted); position: sticky; top: 0; background: var(--card); z-index: 1; padding-bottom: 2px; }
.prow .mv { display: flex; flex-direction: column; }
.prow .mv button, .prow .x, .prow .gap { padding: 0; border: none; background: none; font-size: 9px; line-height: 10px; color: var(--ink); letter-spacing: 0; }
.prow .mv button:disabled { color: var(--rule); }
.prow .gap { border: 1.2px solid var(--rule); height: 26px; font-size: 10px; color: var(--muted); }
.prow .gap.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.prow .x { font-size: 16px; color: var(--muted); height: 26px; }
.prow .x:hover { color: var(--bad); }
.prow select.unk, .ed select.unk { border-color: var(--warn); color: var(--warn); }
.prow input.chg, .prow select.chg { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
footer { margin-top: 28px; font-size: 10.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
footer a { color: var(--muted); }
@media (display-mode: standalone) { #pairbtn { display: none; } }
.pair { margin-top: 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.pair .qr { background: #fff; padding: 10px; line-height: 0; }
.pair .qr img { width: 220px; height: 220px; image-rendering: pixelated; }
/* the Symbols tab: every symbol's class and category */
.sy-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
.sy-bar input { max-width: 280px; padding: 6px 8px; }
.sy-bar select { max-width: 220px; }
.clsf { display: flex; gap: 0; flex-wrap: wrap; }
.clsf button { padding: 4px 8px; font-size: 9.5px; border-right-width: 0; }
.clsf button:last-child { border-right-width: 1.2px; }
.clsf button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.clsf button span { font-weight: 500; opacity: .7; margin-left: 2px; }
.cls { display: inline-flex; align-items: center; gap: 5px; font: 600 9.5px var(--mono); letter-spacing: .1em; white-space: nowrap; }
.cls i { display: inline-block; width: 11px; border-top: 2.4px solid currentColor; }
.cls.auto { font-weight: 500; }
.cls.auto b { font-weight: 500; color: var(--muted); letter-spacing: .04em; margin-left: 2px; }
.sy { background: var(--card); border: 1.2px solid var(--ink); }
.sy-r { display: grid; grid-template-columns: 22px minmax(0, 2.2fr) 80px 128px minmax(0, 1.3fr) 46px; gap: 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--rule); font-size: 11.5px; }
.sy-r.head { font: 600 9px var(--mono); letter-spacing: .12em; color: var(--muted); position: sticky; top: 0; background: var(--card); z-index: 1; border-bottom-color: var(--ink); }
.sy-r .nm { font: 600 14px var(--cond); letter-spacing: .05em; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: none; padding: 0; text-align: left; color: var(--ink); text-transform: none; display: block; width: 100%; }
.sy-r .nm:hover { color: var(--accent); background: none; }
.sy-r.chg { background: color-mix(in srgb, var(--accent) 9%, var(--card)); }
.sy-r.open { background: var(--panel); }
.sy-r .was { color: var(--muted); font-size: 10px; text-decoration: line-through; margin-right: 4px; }
.sy-r .src, .sy-r .pc { color: var(--muted); font-size: 10.5px; }
.sy-r input[type=checkbox] { width: auto; margin: 0; }
.sy-d { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-bottom: 1.2px solid var(--ink); background: var(--paper); }
.sy-d .prev { max-height: 62vh; }
.sy-d .facts label { font: 600 9px var(--mono); letter-spacing: .14em; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.sy-d .facts select { font-size: 12px; padding: 6px; }
.sy-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sy-bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1.2px solid var(--ink); background: var(--panel); margin-bottom: 8px; font-size: 11.5px; }
.sy-foot { position: sticky; bottom: 0; z-index: 3; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--panel); border: 1.2px solid var(--ink); box-shadow: 0 -6px 14px -10px rgba(0,0,0,.35); margin-top: 10px; }
.sy-cats { margin-bottom: 14px; }
.sy-cats table { max-width: 720px; }
.sy-cats td, .sy-cats th { padding: 4px 10px 4px 0; vertical-align: middle; }
.sy-cats select { min-width: 190px; }
.sy-r .ct2 { display: none; }
@media (max-width: 720px) {
  .sy-r { grid-template-columns: 22px minmax(0, 1fr) 96px; }
  .sy-r .src, .sy-r .pc, .sy-r .ct { display: none; }
  .sy-r .ct2 { display: block; font: 500 10px var(--mono); color: var(--muted); }
  .sy-d, .sy-edit { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .card-b.edit { grid-template-columns: 1fr; }
  .card-b.edit .prev { position: static; max-height: 340px; }
  .prow { grid-template-columns: 16px 26px repeat(3, minmax(0, 1fr)) 26px 26px; grid-template-areas: "mv gap lab lab lab flip x" "mv dir dir sig conn conn conn"; padding-bottom: 5px; border-bottom: 1px solid var(--rule); }
  .prow select { font-size: 10px; padding: 5px 0 5px 2px; }
  .prow.head { display: none; }
  .ed .top { grid-template-columns: 1fr 1fr; } .ed .top label:first-child { grid-column: 1 / -1; }
  .card-b { grid-template-columns: 1fr; }
  .prev { border-right: none; border-bottom: 1px solid var(--rule); max-height: 380px; }
  .chips { margin-left: 0; justify-content: flex-start; width: 100%; }
  .who { margin-left: 0; width: 100%; }
}
@media (pointer: coarse) {
  button:not(.prow button) { min-height: 36px; }
  .prow { grid-template-columns: 30px 26px repeat(3, minmax(0, 1fr)) 30px 30px; }
  .prow .mv button { font-size: 16px; line-height: 22px; }
  .prow .x { font-size: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SIGNAL<b>FLOW</b></div>
    <div class="sub">SYMBOL DESK</div>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
  <footer>
    <a href="https://github.com/MattVillis/signalflow-symbols/issues" target="_blank" rel="noopener">Symbol issues on GitHub</a>
    <a href="https://github.com/MattVillis/signalflow-symbols/blob/main/library.json" target="_blank" rel="noopener">library.json</a>

    <a href="https://mattvillis.github.io/signalflow/" target="_blank" rel="noopener">SignalFlow</a>
  </footer>
</div>
<script>
(() => {
  const OWNER = "MattVillis", REPO = "signalflow-symbols", API = "https://api.github.com";
  const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/`;
  const MARK = "Symbol submission from SignalFlow";
  const FIX_MARK = "Symbol correction from SignalFlow";   // "Suggest a fix" in the app (built-in or shared symbol)
  // "Suggest a category" in the app: approving it runs the symbols repo's category.yml, which files the symbols under
  // the category in library.json's catalog (built-ins included: the catalog re-files a shipped symbol with no new build)
  const CAT_MARK = "Category suggestion from SignalFlow";
  const KEY = "sf_desk_token";
  /* Copied from src/App.jsx (CONN, CATEGORIES) on 2026-10-25. The app blanks a connector its catalogue does
     not list, so the desk warns about one and the editor offers only these. Refresh both when the app's change. */
  const CONN = {
    video: ["HDMI", "DP", "12G SDI", "6G SDI", "3G SDI", "HD SDI", "DVI", "VGA", "BNC", "HD-BNC", "RJ45", "SFP+", "SFP28", "USB-C"],
    fiber: ["OPTICALCON DUO", "OPTICALCON QUAD", "LC", "SC", "SFP", "SFP+", "SFP28", "QSFP+", "QSFP28", "SM FIBER", "MM FIBER"],
    network: ["RJ45", "ETHERCON", "SFP", "SFP+", "SFP28", "QSFP+", "QSFP28", "RJ45 10G"],
    audio: ["XLR", "TRS", "AES3", "MADI", "ANALOG", "SPDIF", "DIN 1.0/2.3", "RJ45", "ETHERCON", "USB-A", "USB-B", "USB-C", "NL4", "NL8", "CA-COM", "PA-COM", "SC32", "SPEAKER TERMINAL", "TERMINAL", "AES50", "ULTRANET", "RJ45 AUDIO", "TOSLINK", "ANTENNA", "BNC", "DB25", "RCA", "3.5MM"],
    control: ["DMX 5PIN", "DMX 3PIN", "DMX RJ45", "DMX TERMINAL", "RS-232", "GPIO", "MIDI", "LTC", "XLR", "BNC", "D-SUB 9", "D-SUB 15", "D-SUB 26", "TRS", "CAN", "USB-A", "USB-B", "USB-C", "OCULINK"],
    power: ["POWERCON", "POWERCON 32A", "TRUE1", "IEC C13", "IEC C14", "IEC C19", "IEC C20", "DC", "XLR 4-PIN", "USB-C", "CEE 16A 1P", "CEE 32A 1P", "CEE 16A 3P", "CEE 32A 3P", "CEE 63A 3P", "CEE 125A 3P", "SOCAPEX", "POWERLOCK", "CAMLOK", "SCHUKO"],

    Object.values(state.sy.pend.cats).forEach(c => add(c.name));
    return out;
  }

  // ---- changes waiting to be published: per symbol {class?, category?} and per category {name, class?, add?}; null = clear
  const sy = state.sy;
  const pendCount = () => Object.keys(sy.pend.sym).length + Object.keys(sy.pend.cats).length;
  const baseCatalog = () => catalog || { cats: [], defs: {} };
  function pendingEdit() {
    const names = new Map(symRows(baseCatalog()).map(r => [r.id, r.name]));
    return { symbols: Object.entries(sy.pend.sym).map(([id, v]) => ({ id, name: names.get(id) || id, ...v })),
      categories: Object.values(sy.pend.cats).map(c => ({ name: c.name, ...("class" in c ? { class: c.class } : {}) })) };
  }
  // the catalog as it will be once the waiting changes are published: the repo's own applyCatalogEdit, so what this
  // page shows is what catalog.yml will write
  function effCatalog() {
    const base = baseCatalog(); if (!pendCount() || !L?.applyCatalogEdit) return base;
    const f = { library: lib || [], catalog: clone(base) };
    try { L.applyCatalogEdit(f, L.normaliseCatalogEdit(pendingEdit())); } catch { /* over a cap: the publish says so */ }
    return f.catalog;
  }
  const tidy = (id, cur) => { if (Object.keys(cur).length) sy.pend.sym[id] = cur; else delete sy.pend.sym[id]; };
  // cls "" = automatic (clear the symbol's own class)
  function setSymClass(id, cls) {
    const was = cleanClass(baseCatalog().defs?.[id]?.class), cur = { ...(sy.pend.sym[id] || {}) };
    if ((cls || "") === was) delete cur.class; else cur.class = cls || null;
    tidy(id, cur);
  }
  // picking the symbol's OWN category clears its re-filing
  function setSymCat(id, category, own) {
    const was = baseCatalog().defs?.[id]?.category || "", want = category && category.toLowerCase() !== own.toLowerCase() ? category : "";
    const cur = { ...(sy.pend.sym[id] || {}) };
    if (want.toLowerCase() === was.toLowerCase()) delete cur.category; else cur.category = want || null;
    tidy(id, cur);
  }
  // cls "" = the built-in allotment (or none, for a category that has no built-in one)
  function setCatClass(name, cls) {
    const key = catKeyOf(name), was = cleanClass(baseCatalog().catClass?.[key]), want = cls && cls !== (CAT_CLASS[key] || "") ? cls : "";
    const cur = { ...(sy.pend.cats[key] || { name }) };
    if (want === was) delete cur.class; else cur.class = want || null;
    if ("class" in cur || cur.add) sy.pend.cats[key] = cur; else delete sy.pend.cats[key];
  }
  function addCategory() {
    const name = sy.newName.replace(/[^A-Za-z0-9 /&+-]/g, "").replace(/\s+/g, " ").trim().slice(0, 18);
    if (name.length < 2 || /^custom$/i.test(name)) { sy.pub = { kind: "bad", text: "A category name is 2 to 18 letters, digits, spaces or / & + -, and not Custom." }; return; }
    if (allCats(baseCatalog()).some(c => c.toLowerCase() === name.toLowerCase())) { sy.pub = { kind: "bad", text: `${name} is already a category.` }; return; }
    sy.pend.cats[catKeyOf(name)] = { name, add: true, ...(sy.newCls ? { class: sy.newCls } : {}) };
    sy.newName = ""; sy.newCls = ""; sy.pub = null;
  }

  async function publishCatalog() {
    const e = pendingEdit(), errs = L.validateCatalogEdit(e);
    if (errs.length) { sy.pub = { kind: "bad", text: errs[0] }; return render(); }
    const n = L.normaliseCatalogEdit(e), one = n.symbols.length === 1 && !n.categories.length ? n.symbols[0] : null;
    const say = v => v === null ? "automatic" : v;
    const title = "[catalog] " + (one ? `${one.name}: ${["class" in one ? `class ${say(one.class)}` : "", "category" in one ? `category ${say(one.category)}` : ""].filter(Boolean).join(", ")}`
      : [n.symbols.length ? `${n.symbols.length} symbol${n.symbols.length > 1 ? "s" : ""}` : "", n.categories.length ? `${n.categories.length} categor${n.categories.length > 1 ? "ies" : "y"}` : ""].filter(Boolean).join(", "));
    const body = `${CATALOG_MARK}.\n\n${L.catalogEditSummary(n)}\n\n${T3}json\n${JSON.stringify(n)}\n${T3}\n`;
    sy.pub = { kind: "busy", text: "Opening the change on GitHub…" }; render();
    try {
      const iss = await gh(`/repos/${OWNER}/${REPO}/issues`, { method: "POST", body: JSON.stringify({ title, body }) });
      const t0 = Date.now();
      // a separate call, so GitHub fires the "labeled" event catalog.yml listens for
      await gh(`/repos/${OWNER}/${REPO}/issues/${iss.number}/labels`, { method: "POST", body: JSON.stringify({ labels: ["approved"] }) });
      sy.pub = { kind: "busy", text: `Applying #${iss.number}… (the workflow takes about 30 s)` }; render();
      while (Date.now() - t0 < 180000) {
        await new Promise(r => setTimeout(r, 5000));
        const [now, comments] = await Promise.all([gh(`/repos/${OWNER}/${REPO}/issues/${iss.number}`), gh(`/repos/${OWNER}/${REPO}/issues/${iss.number}/comments?per_page=100`)]);
        const fail = comments.find(c => /Not published/.test(c.body));
        if (fail) { sy.pub = { kind: "bad", text: `#${iss.number} not applied: ` + fail.body.replace(/^.*?—\s*/, "").slice(0, 200) }; await refresh(); return render(); }
        if (now.state === "closed") {
          sy.optimistic = { catalog: effCatalog(), at: t0, ids: n.symbols.map(s => s.id), keys: n.categories.map(c => catKeyOf(c.name)) };
          catalog = sy.optimistic.catalog;
          sy.pend = { sym: {}, cats: {} }; sy.sel.clear();
          sy.pub = { kind: "ok", text: `✓ Applied (#${iss.number}). Every app picks it up on its next sync, within 30 minutes.` };
          render(); refresh().then(render).catch(() => {});
          return;
        }
      }
      sy.pub = { kind: "bad", text: `#${iss.number} still not applied after 3 minutes. Check the workflow runs (link at the bottom); it is listed above to retry.` };
      await refresh(); render();
    } catch (e) { sy.pub = { kind: "bad", text: e.status === 403 || e.status === 404 ? "The token can't create or label issues. Give it Issues: Read and write." : e.message }; render(); }
  }
  async function retryCatalog(n) {
    try {
      await gh(`/repos/${OWNER}/${REPO}/issues/${n}/labels/approved`, { method: "DELETE" }).catch(e => { if (e.status !== 404) throw e; });
      await gh(`/repos/${OWNER}/${REPO}/issues/${n}/labels`, { method: "POST", body: JSON.stringify({ labels: ["approved"] }) });
      sy.pub = { kind: "busy", text: `Retrying #${n}… give it a minute, then Refresh.` };
    } catch (e) { sy.pub = { kind: "bad", text: e.message }; }
    render();
  }
  async function closeCatalog(n) {
    try { await gh(`/repos/${OWNER}/${REPO}/issues/${n}`, { method: "PATCH", body: JSON.stringify({ state: "closed", state_reason: "not_planned" }) }); await refresh(); }
    catch (e) { sy.pub = { kind: "bad", text: e.message }; }
    render();
  }

  // the list's filters: search (name, id, category), class (skipped when counting the class buttons), category, source, changed
  function syMatch(r, skip) {
    const ql = sy.q.trim().toLowerCase();
    return (!ql || r.name.toLowerCase().includes(ql) || r.id.toLowerCase().includes(ql) || r.category.toLowerCase().includes(ql))
      && (skip === "cls" || !sy.fcls || r.cls === sy.fcls) && (!sy.fcat || r.category.toLowerCase() === sy.fcat.toLowerCase())
      && (!sy.fsrc || r.src === sy.fsrc) && (!sy.changed || !!sy.pend.sym[r.id]);
  }
  function onSy(b) {
    const k = b.dataset.sy;
    if (k === "open") sy.open = sy.open === b.dataset.id ? null : b.dataset.id;
    else if (k === "fcls") sy.fcls = b.dataset.v;
    else if (k === "selnone") sy.sel.clear();
    else if (k === "catadd") addCategory();
    else if (k === "discard") { sy.pend = { sym: {}, cats: {} }; sy.pub = null; }
    else if (k === "publish") return publishCatalog();
    else if (k === "retry") return retryCatalog(+b.dataset.n);
    else if (k === "close") return closeCatalog(+b.dataset.n);
    render();
  }
  function onSyChange(el) {
    const k = el.dataset.syc, id = el.dataset.id;
    const own = () => new Map(symRows(baseCatalog()).map(r => [r.id, r.own]));
    if (k === "ncls") { sy.newCls = el.value; return; }
    if (k === "cls") setSymClass(id, el.value);
    else if (k === "cat") setSymCat(id, el.value, el.dataset.own);
    else if (k === "ccls") setCatClass(el.dataset.cat, el.value);
    else if (k === "fcat") sy.fcat = el.value;
    else if (k === "fsrc") sy.fsrc = el.value;
    else if (k === "chg") sy.changed = el.checked;
    else if (k === "sel") { if (el.checked) sy.sel.add(id); else sy.sel.delete(id); }
    else if (k === "selall") symRows(effCatalog()).filter(r => syMatch(r)).forEach(r => { if (el.checked) sy.sel.add(r.id); else sy.sel.delete(r.id); });
    else if (k === "bcls" && el.value !== "__") [...sy.sel].forEach(i => setSymClass(i, el.value));
    else if (k === "bcat" && el.value !== "__") { const o = own(); [...sy.sel].forEach(i => setSymCat(i, el.value, o.get(i) || "Custom")); }
    // an edit makes an old success or error line stale
    if (["cls", "cat", "ccls", "bcls", "bcat"].includes(k) && sy.pub?.kind !== "busy") sy.pub = null;
    render();
  }
  function symbolsTabHtml() {
    const base = baseCatalog(), cat = effCatalog(), rows = symRows(cat), was = new Map(symRows(base).map(r => [r.id, r]));
    const cats = allCats(cat), can = !!L?.applyCatalogEdit;
    const shown = rows.filter(r => syMatch(r)), counts = {};
    rows.filter(r => syMatch(r, "cls")).forEach(r => { counts[r.cls] = (counts[r.cls] || 0) + 1; });
    const nB = rows.filter(r => r.src === "built-in").length, nS = rows.length - nB;

      <a href="${esc(i.html_url)}" target="_blank" rel="noopener">open ↗</a><span class="grow" style="flex:1"></span>
      <button data-sy="retry" data-n="${i.number}">↻ Retry</button><button class="bad" data-sy="close" data-n="${i.number}">Close</button></div>`));
    parts.push(`<p class="note" style="margin:0 0 10px">${nB} built-in · ${nS} shared · catalog: ${nSet} class${nSet === 1 ? "" : "es"} set on symbols, ${nAl} categor${nAl === 1 ? "y" : "ies"} allotted by the desk, ${(base.cats || []).length} extra categor${(base.cats || []).length === 1 ? "y" : "ies"}. Every symbol has a <b>class</b> (the library filter in the app) and a <b>category</b> (where it is filed).</p>`);

    parts.push(`<details class="sy-cats" ${sy.showCats ? "open" : ""} data-sy-cats><summary>CATEGORIES AND THEIR CLASS</summary>

      <table><thead><tr><th>CATEGORY</th><th>CLASS</th><th>SYMBOLS</th></tr></thead><tbody>
      ${cats.map(c => { const key = catKeyOf(c), builtIn = CAT_CLASS[key] || "", cur = catClassOf(c, cat), pc = sy.pend.cats[key], custom = key === "custom";
        return `<tr${pc ? ' style="background:color-mix(in srgb, var(--accent) 9%, var(--card))"' : ""}><td>${esc(c)}${pc?.add ? ' <span class="chip info">NEW</span>' : ""}</td>
          <td>${custom ? '<span class="note">mixed (catch-all)</span>' : `<select data-syc="ccls" data-cat="${esc(c)}" ${can ? "" : "disabled"}>${builtIn ? "" : opt("", cur, "— mixed: by ports —")}${CLASSES.map(([k, lab]) => opt(k, cur, lab + (k === builtIn ? " (built in)" : ""))).join("")}</select>`}</td>
          <td>${nIn[c.toLowerCase()] || 0}</td></tr>`; }).join("")}
      </tbody></table>
      <div class="row" style="margin-top:8px"><input data-syi="newName" placeholder="New category, e.g. Amplifiers" maxlength="18" value="${esc(sy.newName)}" style="max-width:240px;padding:6px 8px">
        <select data-syc="ncls"><option value="">— mixed: by ports —</option>${clsOpts(sy.newCls)}</select>

    parts.push(`<div class="sy-bar">

      <select data-syc="fcat"><option value="">All categories</option>${cats.map(c => opt(c, sy.fcat)).join("")}</select>

      <label class="note" style="display:flex;gap:5px;align-items:center"><input type="checkbox" data-syc="chg" ${sy.changed ? "checked" : ""} style="width:auto">changed only</label>
    </div>`);
    const sel = [...sy.sel];
    if (sel.length) parts.push(`<div class="sy-bulk"><b>${sel.length} ticked</b>
      <span class="note">Class</span><select data-syc="bcls" ${can ? "" : "disabled"}><option value="__">— set class —</option><option value="">Automatic</option>${clsOpts("__")}</select>

      ${shown.map(r => rowHtml(r, was.get(r.id), cats, opt, clsOpts, can)).join("") || `<div class="empty" style="border:none">No symbols match.</div>`}</div>`);

    if (nP || sy.pub) parts.push(`<div class="sy-foot">
      ${nP ? `<b>${nP} change${nP === 1 ? "" : "s"} waiting</b><button class="primary" data-sy="publish" ${can && sy.pub?.kind !== "busy" ? "" : "disabled"}>Publish to the shared library</button><button data-sy="discard" ${sy.pub?.kind === "busy" ? "disabled" : ""}>Discard</button>` : ""}

  }
  function rowHtml(r, w, cats, opt, clsOpts, can) {

          <dt>FILED</dt><dd>${esc(r.category)}${r.category !== r.own ? ` (its own category is ${esc(r.own)})` : ""}</dd><dt>PORTS</dt><dd>${P.length}</dd></dl>

  // (not while class / category changes wait to be published, or a field on the Symbols tab has the focus)
  const quietRefresh = async () => { if (token && L && document.visibilityState === "visible" && !Object.values(state.status).some(s => s.busy) && !Object.values(state.rejecting).some(Boolean) && !Object.values(state.fixing).some(Boolean) && !Object.keys(state.edit).length && !Object.keys(state.catEdit).length
    && !pendCount() && sy.pub?.kind !== "busy" && !(tab === "sym" && document.activeElement?.closest?.("#app") && /INPUT|SELECT/.test(document.activeElement.tagName))) { lastQuiet = Date.now(); try { await refresh(); render(); } catch {} } };
  // the categories panel stays open or shut across redraws ("toggle" does not bubble, so listen while it travels down)
  document.addEventListener("toggle", e => { if (e.target.matches?.("[data-sy-cats]")) sy.showCats = e.target.open; }, true);
  setInterval(quietRefresh, 120000);
  // reopening the phone app resumes the old page, so check again when it comes back after a while
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - lastQuiet > 30000) quietRefresh(); });
  if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});

  if (token) boot(); else render();
})();
</script>
</body>
