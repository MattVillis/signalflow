<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalFlow — AV Signal Schematic Editor</title>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div id="root"></div>
<script>
// Outside claude.ai the Anthropic API needs your own key. Asked once, kept in this
// browser's localStorage only. Delete with: localStorage.removeItem("sf_api_key")
// Feedback endpoint: paste a Formspree / Tally / Apps Script URL here and the
// in-app feedback form posts JSON to it. Left empty it offers a GitHub issue.
window.SF_FEEDBACK_URL = "";
(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
      var key = localStorage.getItem("sf_api_key");
      if (!key) {
        key = window.prompt("Anthropic API key for the AI symbol analyzer (sk-ant-...):\nStored only in this browser. Cancel to skip — everything else works without it.");
        if (key) localStorage.setItem("sf_api_key", key.trim());
      }
      if (key) {
        opts = opts || {};
        var h = opts.headers || {};
        h["x-api-key"] = key.trim();
        h["anthropic-version"] = "2023-06-01";
        h["anthropic-dangerous-direct-browser-access"] = "true";
        opts.headers = h;
      }
    }
    return orig(url, opts);
  };
})();
</script>
<script>(()=>{var n2=Object.create;var Vx=Object.defineProperty;var o2=Object.getOwnPropertyDescriptor;var r2=Object.getOwnPropertyNames;var a2=Object.getPrototypeOf,i2=Object.prototype.hasOwnProperty;var s2=(e,t)=>()=>(e&&(t=e(e=0)),t);var cr=(e,t)=>()=>(t||e((t={exports:{}}).exports,t),t.exports);var l2=(e,t,n,o)=>{if(t&&typeof t=="object"||typeof t=="function")for(let r of r2(t))!i2.call(e,r)&&r!==n&&Vx(e,r,{get:()=>t[r],enumerable:!(o=o2(t,r))||o.enumerable});return e};var Hr=(e,t,n)=>(n=e!=null?n2(a2(e)):{},l2(t||!e||!e.__esModule?Vx(n,"default",{value:e,enumerable:!0}):n,e));var le,F=s2(()=>{le=[{date:"2026-10-15",items:["**Fixed: big symbols could not be submitted to the shared library.** GitHub refuses a link that long, so a symbol with more than about 37 ports opened an error page instead of an issue. Now a symbol that big is copied to your clipboard (or downloaded, if the clipboard is blocked) and the issue opens ready for you to paste it in. Submissions also keep the gaps between port groups and a modular symbol's card slots.",`**Download PDF.** A new button in the Export menu saves a real PDF at the page size you picked (A4, A3 or A2), whatever printer you have. Before, the only way was Print, and on a Mac "Save as PDF" in the print window is limited to your printer's paper sizes, so an A2 sheet could not be saved at A2. Text in the PDF stays text, in SignalFlow's own fonts. The first one takes a few seconds while the PDF tools load.`,"**Fixed: cable arrowheads were missing from SVG files and prints.** They are back.","**Copy, paste and duplicate work on notes and zones.** `Ctrl+C` / `Ctrl+V` / `Ctrl+D` used to copy only symbols. Shift-click, the selection box and `Ctrl+A` now pick up notes and zones too, and dragging a mixed selection moves all of it.","**Fixed: a sheet with only notes on it could not be exported.** SVG, Print and PDF were greyed out until the sheet had a symbol."]},{date:"2026-10-14",items:["**disguise IP-VFC split into IP and SDI cards.** An IP-VFC outputs either ST 2110 or SDI, never both, so the one card that showed both is now two in every VX, GX and EX VFC slot: **IPVFC IP (2110)** (primary port plus the 2022-7 redundant port) and **IPVFC SDI 2X 12G** (SDI 1 and SDI 2). Placed devices that already had an IP-VFC keep it as the IP card."]},{date:"2026-10-13",items:["**Move ports up and down a symbol.** Every port row in New symbol, the device editor and the AI preview has a grip to drag it anywhere in the list, and \u25B2 \u25BC arrows that move it one place up or down its side of the symbol. Add a port at the end, then move it next to the others of its kind. Cables stay connected, and a card's ports stay inside their slot."]},{date:"2026-10-12",items:["**Fixed: cables keep the old type when you retype a port.** Changing a port from network to fibre (or any other type) in the device editor now changes the cables plugged into it too, so they draw, filter and list as the new type. It works whichever end you edit, for one device, every copy or the library symbol, and one `Ctrl+Z` undoes the port and its cables together.","**Generic monitors and a speaker.** Under Display: a **generic monitor** (HDMI, DisplayPort and USB-C in), a **generic SDI monitor** (two 12G-SDI inputs with loop-outs, HDMI, 12V on a 4-pin XLR) and a **generic large display** (three HDMI and a DisplayPort in, LAN and RS-232 control). Under Audio: a **generic active speaker** with one XLR input, for a Genelec-style powered monitor. For when the exact model does not matter.","**The whole NETGEAR M4250, M4350 and M4500 range.** All 13 M4250 (NETGEAR's AV Line), all 18 M4350 and both M4500 switches are in the library under Network, 33 in all, from NETGEAR's installation guides and datasheets. Every port is numbered as on the panel, PoE ports are marked PoE+ or PoE++ (so the Power view lights what they feed), and each has its management, console and USB ports and its real power inputs: the external 54V adapter on the desktop models, two or three PSUs where the switch has them, and the empty APS bays on the M4350.","**Switch config: right port names for each NETGEAR family.** NETGEAR's CLI reference says an M4250 on current firmware names its ports **0/1, 0/2\u2026**, not 1/0/1, so the change set now writes `interface 0/1` for an M4250 (including a shared-library M4250 symbol). The M4350 keeps 1/0/1. An M4500 gets its own syntax, since it has none of the `vlan participation` commands. The management address now uses `ip management vlan`, the command in the current reference. You can still override the naming per switch in the device editor.","**NETGEAR AV Line M4250-8G2XF-PoE+.** The 8-port PoE+ switch with two 10G SFP+ uplinks, under Network: eight PoE+ ports, SFP+ 9 and 10, the management and console ports and its 54V power input. **Lists > Switch config** numbers it the way NETGEAR does, 1/0/1 to 1/0/10.","**Fixed: switch config numbered the management port.** The out-of-band management socket was given an interface number (1/0/11 on an 8-port switch, 1/0/31 on the M4250-26G4F). It is a separate service port on NETGEAR, so it is now left out of the port map and the change set.","**Computers.** A new library category for the PCs around a show: the **Minisforum MS-A2** and **MS-A1**, the **ASUS NUC 14 Pro** (what the Intel NUC became), and three generic ones, a **mini PC**, a **workstation with a 4-output graphics card** and a **laptop**, for when the exact model does not matter. USB-C and Thunderbolt ports that carry DisplayPort are drawn as video outputs, so a cable from one to a screen or a converter reads as video.","**Blackmagic Micro Converter BiDirectional SDI/HDMI, 12G and 3G.** SDI to HDMI and HDMI to SDI at the same time, each with SDI in and out, HDMI in and out and USB-C power, from Blackmagic's tech specs. Under Control with the other Blackmagic converters."]},{date:"2026-10-10",items:["**Fixed: a Restore offer for a drawing you never touched.** Opening SignalFlow, changing nothing and coming back later asked whether to restore the previous session. It now only offers that once you have actually drawn something.","**Live sessions: draw together.** Click **SESSION** in the toolbar, put in your name and **Start a session**, then send the link. Everyone who opens it edits the same drawing at the same time, on the same sheet or on different ones. You see each other's cursors and what each person has selected, in their own colour, and the toolbar shows who is in. `Ctrl+Z` only takes back your own changes, never someone else's. If the connection drops you keep drawing, and your changes go through when it comes back. Nothing to install: it runs on SignalFlow's session server, and a session is kept for 30 days after the last edit. **Leave session** keeps the drawing open on your screen; save a file as well if you want your own copy."]},{date:"2026-10-09",items:["**Trace a signal end to end.** Select a cable (or a whole device) and press `T`, or **Trace** in the toolbar, and its path lights up while everything else fades: back to the source, forward to every destination, through converters, fibre and AV-over-IP, and onto other sheets (the chip at the top left has a button for each sheet the path continues on). Through a switch it follows the stream, so a decoder traces back to the encoders and not to the Dante node on the next port, while a plain LAN or control cable stops at the switch rather than lighting up the whole network. `T` or `Esc` stops.","**Zones carry what is in them.** Drag a zone and the devices, notes and smaller zones inside it move with it, cable bends included, so a whole rack or position moves in one go. Select a zone to see what it will take along. Hold `Alt` while dragging to move just the zone, to fit it around the kit again. One `Ctrl+Z` puts it all back.","**Switch ports pick up the VLAN of what you plug in.** If a device port already has a VLAN (from its symbol, or set in the device editor), cabling it to an empty switch port sets that switch port to the same VLAN, ready for the switch config and the patch sheet. A switch port that already has a VLAN, or is a trunk, is never changed: you get a warning if the two disagree. Works with **Link\u2026** too, and one `Ctrl+Z` undoes the cable and the VLAN. Turn it off in Settings if you would rather set switch ports by hand.","**Fill switch ports.** For cables drawn before that, the VLAN registry has a **Fill switch ports** button. It does the same for every cable already on the drawing, in one step you can undo. It shows how many ports it will set, and lists any that disagree with their device without changing them.","**Moving a cable end counts too.** Dragging a cable end onto a different, empty switch port gives that port the device\u2019s VLAN."]},{date:"2026-10-08",items:["**VLAN lists in and out.** The VLAN registry has **Import\u2026**, **Export** and **CSV**. Hand a house VLAN plan to another crew as a file, or bring one in from the network person's spreadsheet: VLAN, NAME, SUBNET, FROM, COLOUR, with or without a header row. Import only adds: a VLAN number you already have is left exactly as it is.","**Back to the library version.** A device whose ports you edited by hand has a **\u21BA Library version** button in its editor. It puts the ports and width back to the library symbol and keeps the VLAN, trunk, LAG and IP settings on its ports. It warns you if a port only that device had (and any cable on it) will go.","**Replace several devices at once.** Select them all (eight encoders, say) and press `R` or **Replace\u2026**. Every device is worked out on its own and the list ranks symbols by how many cables they keep across the lot. A table shows any device that would lose a cable or a VLAN setting. One `Ctrl+Z` undoes the whole swap.","**New VLANs get their own colours.** VLANs numbered 10, 20, 30\u2026 all came out the same blue. Each VLAN you add now takes a colour no other VLAN is using. If an existing project already has several on one colour, the registry offers a button to give each its own.","**Numbered ports can start anywhere.** Add multiple has a **from** box: set 25 to add PORT 25\u201326 for the 1G pair on a 24+2 switch. Leave it blank to carry on from the last number as before.","**Cable numbers stay put.** A cable keeps its number for good, so labels you have already printed stay right: a new cable takes the next free number instead of shifting everything after it, and deleting one leaves a gap rather than renumbering the rest. Older projects are numbered on open exactly as their lists printed before. Breakout legs still share their DAC's number. **Renumber\u2026** in Lists \u2192 Cables starts again from C001 when you want a clean set. A selected cable shows its number, and `Ctrl+F` finds a cable by the label in your hand (`C13`, `C013-2`).","**Only the left button moves things.** Middle-drag now pans the sheet even when it starts on a symbol, and a right-click no longer drags a symbol, note or cable end around.","**40G breakouts into SFP28 ports.** A QSFP+ 4\xD7 10G breakout DAC can now land its tails in SFP28 ports as well as SFP+ ones \u2014 even a mix on the same cable. Those legs carry the note *SFP+ leg in SFP28 port \xB7 runs at 10G*.","**QSFP+ into a QSFP28 port is allowed.** A 100G QSFP28 port takes a 40G QSFP+ module, so that cable now links with the note *QSFP+ module in QSFP28 port \xB7 runs at 40G*, the same way SFP+ into SFP28 does.","**Shortcuts work on every keyboard layout.** On Russian, Greek, Hebrew and other non-Latin layouts the letter shortcuts did nothing \u2014 `Ctrl+Z` and `Ctrl+S` included \u2014 and now work from the same keys. On French (AZERTY) keyboards the number shortcuts work without Shift: hold `1` / `2` / `3` while clicking a port, and `0` to reset the zoom. Letter shortcuts still follow the letter printed on your key, so `Ctrl+Z` is the key labelled Z, as in every other app.","**Replacing a switch keeps the VLANs on unpatched ports too.** Ports you had set up with a VLAN, trunk, LAG or IP before anything was plugged in now move to the new switch as well \u2014 same port name where it exists, otherwise the next free port. They are listed in the Replace table under the cables, can be moved by hand, and if the new switch has no room for some of them the window says so before you commit.",'**Pressing `R` no longer types an "r" into the Replace search.** The window opens with an empty search box, ready to type.',"**SFP+ into an SFP28 port is allowed.** A 25G SFP28 port takes a 10G SFP+ module, so that cable now links instead of being refused, with the note *SFP+ module in SFP28 port \xB7 runs at 10G* in the popover and the cable list.","**Replace a symbol and keep its cables.** Select a device and press `R` (or **Replace\u2026** in the toolbar, or in the device editor) to swap it for a different symbol \u2014 a 48-port switch for a 16-port one, a Videohub 40x40 for a 20x20. Each cable moves to a matching port on the new symbol: same name first, then the same kind of port in order, so cables on ports 40 and 41 land on the next free ports rather than anywhere. The list shows up front whether each symbol **fits all** your cables, fits only with adapters, or **drops** some, and a table shows where every cable will go \u2014 change any of them by hand. If a cable has nowhere to go, it says so in red before you commit, and `Ctrl+Z` brings everything back. The device keeps its name and IP, and each port's VLAN, trunk and LAG settings move with its cable.","**Choose where your project is saved.** **Save** now asks where to put the file and what to call it, instead of dropping it in Downloads. After that the project remembers its file: the next **Save** (`Ctrl+S`) asks whether to **overwrite** it or **save as a new file** \u2014 press `Enter` to overwrite. **Save as** (`Ctrl+Shift+S`) always asks for a new location. Opening a project links it to that file too, and the status bar shows which file you are working on. Works in Chrome and Edge; Firefox and Safari still download a copy, as before.","**Windows no longer close when a drag ends outside them.** Selecting text in a field and letting go past the edge of the window used to count as a click on the background, closing it and losing whatever you had typed. A window now closes only on a real click outside it, or its close button."]},{date:"2026-10-05",items:["**Big cable bundles no longer freeze the sheet.** A drawing with a large run of cables between two columns (70+ off a router into a row of servers) could lock the page for many seconds on every move, drag or edit while the cable spacing was worked out again from scratch. The spacing is now worked out much faster, remembered for the parts of the sheet you did not touch, and held still while you drag, then settled once you let go. The cables are drawn in exactly the same places as before.","**Fibre ports take VLANs too.** An SFP or fibre port now has the same VLAN, ACCESS / TRUNK, tagged-VLAN, LAG and IP fields as a copper network port, so a switch's fibre uplinks and a server's SFP NIC can be set up properly. A fibre cable on an access VLAN is drawn in that VLAN's colour and stays solid, so you can still tell it from copper. It also counts in the VLAN registry, the cable list, auto-IP and the switch config output.","**Switch change sets for NETGEAR M4250 / GSM.** Lists gained a **SWITCH CONFIG** tab: pick a switch and it writes the commands for the things the drawing is actually sure about \u2014 VLANs and their names, port PVIDs, trunk tagging, LAG membership and the management address \u2014 ready to review and paste. Two syntaxes: NETGEAR's classic `vlan participation` / `vlan pvid` / `vlan tagging`, or the shorter `switchport` form. Copy it, or download one `.txt` per switch.","**It is a change set, not a config.** It never writes spanning tree, QoS, IGMP snooping, PoE or anything else it cannot read off the sheet, and it deletes nothing \u2014 the one removal, taking access ports out of VLAN 1, is a tick-box that is off until you ask. It never saves on the switch either: apply, verify, then `write memory` yourself, so a reboot undoes a mistake.","**It prints the port map first.** Every interface it is about to touch, with the port label it came from and what it will do \u2014 because an off-by-one between `PORT 1` and `1/0/1` is an outage, and that is the one thing worth checking by eye. If a switch numbers its ports differently, give it a pattern in the device editor (`1/0/{n}`, `xe-0/0/{n}`) and everything follows.","**It warns you about the cable you are sitting on.** If the switch has a management address, the change set names the port carrying that VLAN and tells you to do that one from the console \u2014 re-PVIDing it from a session that runs through it cuts you off mid-paste.","**Leader LT4670 sync generator, with its option modules.** The chassis carries the genlock loop, six analog black outputs, CW/1PPS, word clock, silence, AES/EBU, LTC/remote, L-SYNC and the ethernet port; the five hardware options are slots you fill in the device editor \u2014 `SER01` GNSS, `SER02` 3G-SDI (two can be fitted, so there are two positions), `SER03` PTP SFPs, `SER04` 25G-IP plus 12G-SDI, and `SER11` redundant power. It is placed with the GNSS and the first SDI pair fitted; add the rest from MODULES. `SER02` and `SER04` cannot be fitted together in the real instrument, which the card names say \u2014 the drawing cannot stop you.","**Three connectors the catalogue was missing**: `HD-BNC` (micro-BNC, on 12G gear), `DIN 1.0/2.3` (word clock and AES/EBU on sync panels) and `D-SUB 15` / `D-SUB 26`. The miniature 1.0/2.3 series is not a BNC, so patching one to a full-size BNC is allowed and the cable list asks for the adapter lead.","**Slot headers stop printing through each other.** On a chassis with an input card down one side and an output card down the other, the two slot headings landed on the same line and overlapped. Each now takes its own row."]}]});var tS=cr(_e=>{"use strict";F();var el=Symbol.for("react.element"),d2=Symbol.for("react.portal"),c2=Symbol.for("react.fragment"),f2=Symbol.for("react.strict_mode"),p2=Symbol.for("react.profiler"),h2=Symbol.for("react.provider"),m2=Symbol.for("react.context"),g2=Symbol.for("react.forward_ref"),y2=Symbol.for("react.suspense"),I2=Symbol.for("react.memo"),x2=Symbol.for("react.lazy"),zx=Symbol.iterator;function S2(e){return e===null||typeof e!="object"?null:(e=zx&&e[zx]||e["@@iterator"],typeof e=="function"?e:null)}var jx={isMounted:function(){return!1},enqueueForceUpdate:function(){},enqueueReplaceState:function(){},enqueueSetState:function(){}},Xx=Object.assign,Jx={};function wi(e,t,n){this.props=e,this.context=t,this.refs=Jx,this.updater=n||jx}wi.prototype.isReactComponent={};wi.prototype.setState=function(e,t){if(typeof e!="object"&&typeof e!="function"&&e!=null)throw Error("setState(...): takes an object of state variables to update or a function which returns an object of state variables.");this.updater.enqueueSetState(this,e,t,"setState")};wi.prototype.forceUpdate=function(e){this.updater.enqueueForceUpdate(this,e,"forceUpdate")};function Kx(){}Kx.prototype=wi.prototype;function ph(e,t,n){this.props=e,this.context=t,this.refs=Jx,this.updater=n||jx}var hh=ph.prototype=new Kx;hh.constructor=ph;Xx(hh,wi.prototype);hh.isPureReactComponent=!0;var qx=Array.isArray,Yx=Object.prototype.hasOwnProperty,mh={current:null},Qx={key:!0,ref:!0,__self:!0,__source:!0};function Zx(e,t,n){var o,r={},i=null,u=null;if(t!=null)for(o in t.ref!==void 0&&(u=t.ref),t.key!==void 0&&(i=""+t.key),t)Yx.call(t,o)&&!Qx.hasOwnProperty(o)&&(r[o]=t[o]);var d=arguments.length-2;if(d===1)r.children=n;else if(1<d){for(var f=Array(d),h=0;h<d;h++)f[h]=arguments[h+2];r.children=f}if(e&&e.defaultProps)for(o in d=e.defaultProps,d)r[o]===void 0&&(r[o]=d[o]);return{$$typeof:el,type:e,key:i,ref:u,props:r,_owner:mh.current}}function w2(e,t){return{$$typeof:el,type:e.type,key:t,ref:e.ref,props:e.props
