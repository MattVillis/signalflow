<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalFlow — AV Signal Schematic Editor</title>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div id="root"></div>
<script>
// Outside claude.ai the Anthropic API needs your own key. Asked once, kept in this
// browser's localStorage only. Delete with: localStorage.removeItem("sf_api_key")
// Feedback endpoint: paste a Formspree / Tally / Apps Script URL here and the
// in-app feedback form posts JSON to it. Left empty it offers a GitHub issue.
window.SF_FEEDBACK_URL = "";
(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
      var key = localStorage.getItem("sf_api_key");
      if (!key) {
        key = window.prompt("Anthropic API key for the AI symbol analyzer (sk-ant-...):\nStored only in this browser. Cancel to skip — everything else works without it.");
        if (key) localStorage.setItem("sf_api_key", key.trim());
      }
      if (key) {
        opts = opts || {};
        var h = opts.headers || {};
        h["x-api-key"] = key.trim();
        h["anthropic-version"] = "2023-06-01";
        h["anthropic-dangerous-direct-browser-access"] = "true";
        opts.headers = h;
      }
    }
    return orig(url, opts);
  };
})();
</script>
<script>(()=>{var Sx=Object.create;var Bc=Object.defineProperty;var yx=Object.getOwnPropertyDescriptor;var vx=Object.getOwnPropertyNames;var Cx=Object.getPrototypeOf,Lx=Object.prototype.hasOwnProperty;var wx=(e,t)=>()=>(e&&(t=e(e=0)),t);var Ba=(e,t)=>()=>(t||e((t={exports:{}}).exports,t),t.exports);var kx=(e,t,a,n)=>{if(t&&typeof t=="object"||typeof t=="function")for(let r of vx(t))!Lx.call(e,r)&&r!==a&&Bc(e,r,{get:()=>t[r],enumerable:!(n=yx(t,r))||n.enumerable});return e};var lo=(e,t,a)=>(a=e!=null?Sx(Cx(e)):{},kx(t||!e||!e.__esModule?Bc(a,"default",{value:e,enumerable:!0}):a,e));var ce,J=wx(()=>{ce=[{date:"2026-09-28",items:["**Ghost sheets.** `Alt+1` \u2026 `Alt+6` \u2014 or `Ctrl+Alt+V/F/N/A/C/P` \u2014 fades everything that is not carrying that signal, so a busy sheet becomes just the network, or just the video. They stack, `Esc` clears, and alt-clicking a legend row does the same. A chip top-left names the filter.","**It follows the signal through the kit.** A fibre run is never a service of its own, so it carries whatever the box at its end terminates: focusing VIDEO keeps the fibre between a TX and an RX, focusing NETWORK keeps a fibre trunk carrying the LAN. An RJ45 is read off its port name \u2014 AV, TPS, TPX, SDVoE and NDI ports are an AV stream, DANTE is audio, plain LAN stays the network \u2014 so an AV-over-IP chain shows encoder, switch and decoder without the rest of the LAN lighting up. PoE counts as power.","**Export and save by signal.** The Export menu has a SIGNAL row: tick what you want and it drives the SVG, the Print/PDF and a new **project copy** holding only those cables and the equipment they touch. A normal Save now remembers the view you were in, without removing anything from the file.","**Lightware, in full** \u2014 52 symbols. MX2 matrices including the audio and redundant frames and the DH DisplayPort hybrids, Taurus UCX across its generations, MMX multiport switchers, TPS / TPX / OPTX extenders, VINX, Gemini GVN and UBEX. Ports come from Lightware's own per-model port diagrams.","**openGear frames.** Ross OGX-FR and AJA OG-X-FR with an 18-card catalogue from AJA, Cobalt Digital and Ross. Cards are listed as card + rear-module pairings, because in openGear the rear module is what decides the connectors.","**Power everywhere.** Every symbol that takes mains now has an inlet, DC and 4-pin XLR are proper connector types, and the demo sheet ships with a 12-way distro cabled to everything. One fix worth naming: the disguise EX 3 was drawn with dual IEC \u2014 the whole VX/GX/EX range is a single powerCON TRUE1."]},{date:"2026-09-25",items:["**VLAN subnets and automatic IPs.** Give a VLAN a subnet and, with the setting on, anything you patch to it gets the next free address \u2014 shown under the symbol name, or under the port itself when a box has several LAN connections. Switches are skipped, and the VLAN is taken from either end of the cable.",'**Your VLAN scheme persists.** "Save as defaults" keeps your numbering for every new project, and it travels inside the library file between machines.',"**Switch patch sheet.** A third call list: every network port on every switch, its VLAN, what it connects to and the cable number. Spare ports are listed too, so it doubles as a free-capacity check.","**KVM category** with the ADDERLink XDIP and Matrox Avio 2, transmitter and receiver each.","Tidier library footer \u2014 the file actions became icons and the Repo button now carries its own sync status."]},{date:"2026-09-24",items:["**Collapse a symbol** to only the ports it is patched into \u2014 the `[\u2212]` in the header, or `C` on a selection. Handy on a 48-port frame with six cables in it.",'**Slot presets** for modular symbols: save "VX 4+ with HDMI VFCs", star it as the default for new placements, and it travels in the library file.',"**Client logo in the title block**, with a small designer for its position, size and alignment. It reaches SVG and PDF as well as the screen.","**Pixelhue and Analog Way packs**, plus the Videohub 120x120 12G and the modular Universal Videohub 288.","Port limits lifted when building a symbol \u2014 a 288-port chassis is fine now.","Toolbar tidy; copy/paste/duplicate are keyboard only, and `Ctrl+S` saves."]},{date:"2026-09-23",items:["**Feedback form** in the status bar: bug, idea, missing symbol, with an optional diagnostics line. It never includes your drawing."]},{date:"2026-09-22",items:["**LED processing**: Brompton Tessera, Megapixel HELIOS and the NovaStar range, including the modular H-series.","**PIXERA, LightAct and Blackmagic Design** packs \u2014 cameras in their own category, the 2110 IP range and the rest of Videohub.","**Auto-save** to this browser, with a Restore card if the tab dies. Nothing leaves the machine.","**Ctrl+F** finds devices, ports and IPs across every sheet; **page frames** give a true A4/A3/A2 print and PDF, and the Export menu gathers page size, SVG and print in one place.","The library opens with categories folded, and two inputs or two outputs can no longer be cabled together."]},{date:"2026-09-21",items:["**Editable cable styles**: click a legend row to change a signal's colour, dash and name, and pick how crossings are drawn (none, arc or gap).","**Link editing**: double-click a cable to add a bend, drag either end dot onto a different port.","**Port gaps** for visual separation between port groups on a symbol.","**Call lists**: equipment and a numbered cable list, as CSV or a printable page.","**Connector rules**: two inputs cannot meet, DP\u2194HDMI is drawn as a gradient and flagged as needing a cable or dongle, anything else needs a converter. One cable per port, with a warning before you replace one.","**Cross-sheet references**: click a port, change sheet, click another \u2014 both sheets get a flag pointing at the other."]},{date:"2026-09-18",items:["**Modular symbols**: slots and a card catalogue, with the Barco ENCORE3, E2 Gen 2, EX and ImagePRO-4K, the full disguise VX / GX / EX ranges and the Lightware MX2M frame.","**Shared symbol library** on GitHub with background sync, plus submit-a-symbol straight from the sidebar.","**Link spacing** that minimises crossings, swap-sides on a device, and facing-aware routing.","**Hosted beta** at mattvillis.github.io/signalflow, with the optional local bridge as a download."]},{date:"2026-09-17",items:["Global symbol library kept in the browser, with library export and import.","Research fixes: a verbatim evidence quote is required and the port counts are checked against it."]}]});var jc=Ba(Ie=>{"use strict";J();var gr=Symbol.for("react.element"),Ex=Symbol.for("react.portal"),Tx=Symbol.for("react.fragment"),Rx=Symbol.for("react.strict_mode"),Ax=Symbol.for("react.profiler"),Px=Symbol.for("react.provider"),Ox=Symbol.for("react.context"),Mx=Symbol.for("react.forward_ref"),bx=Symbol.for("react.suspense"),Nx=Symbol.for("react.memo"),Ux=Symbol.for("react.lazy"),Hc=Symbol.iterator;function Bx(e){return e===null||typeof e!="object"?null:(e=Hc&&e[Hc]||e["@@iterator"],typeof e=="function"?e:null)}var Gc={isMounted:function(){return!1},enqueueForceUpdate:function(){},enqueueReplaceState:function(){},enqueueSetState:function(){}},Vc=Object.assign,zc={};function xn(e,t,a){this.props=e,this.context=t,this.refs=zc,this.updater=a||Gc}xn.prototype.isReactComponent={};xn.prototype.setState=function(e,t){if(typeof e!="object"&&typeof e!="function"&&e!=null)throw Error("setState(...): takes an object of state variables to update or a function which returns an object of state variables.");this.updater.enqueueSetState(this,e,t,"setState")};xn.prototype.forceUpdate=function(e){this.updater.enqueueForceUpdate(this,e,"forceUpdate")};function _c(){}_c.prototype=xn.prototype;function au(e,t,a){this.props=e,this.context=t,this.refs=zc,this.updater=a||Gc}var ou=au.prototype=new _c;ou.constructor=au;Vc(ou,xn.prototype);ou.isPureReactComponent=!0;var $c=Array.isArray,qc=Object.prototype.hasOwnProperty,nu={current:null},Wc={key:!0,ref:!0
