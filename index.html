<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalFlow — AV Signal Schematic Editor</title>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div id="root"></div>
<script>
// Outside claude.ai the Anthropic API needs your own key. Asked once, kept in this
// browser's localStorage only. Delete with: localStorage.removeItem("sf_api_key")
// Feedback endpoint: paste a Formspree / Tally / Apps Script URL here and the
// in-app feedback form posts JSON to it. Left empty it offers a GitHub issue.
window.SF_FEEDBACK_URL = "";
(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
      var key = localStorage.getItem("sf_api_key");
      if (!key) {
        key = window.prompt("Anthropic API key for the AI symbol analyzer (sk-ant-...):\nStored only in this browser. Cancel to skip — everything else works without it.");
        if (key) localStorage.setItem("sf_api_key", key.trim());
      }
      if (key) {
        opts = opts || {};
        var h = opts.headers || {};
        h["x-api-key"] = key.trim();
        h["anthropic-version"] = "2023-06-01";
        h["anthropic-dangerous-direct-browser-access"] = "true";
        opts.headers = h;
      }
    }
    return orig(url, opts);
  };
})();
</script>
<script>(()=>{var E2=Object.create;var sS=Object.defineProperty;var T2=Object.getOwnPropertyDescriptor;var A2=Object.getOwnPropertyNames;var R2=Object.getPrototypeOf,O2=Object.prototype.hasOwnProperty;var P2=(e,t)=>()=>(e&&(t=e(e=0)),t);var gr=(e,t)=>()=>(t||e((t={exports:{}}).exports,t),t.exports);var M2=(e,t,n,o)=>{if(t&&typeof t=="object"||typeof t=="function")for(let r of A2(t))!O2.call(e,r)&&r!==n&&sS(e,r,{get:()=>t[r],enumerable:!(o=T2(t,r))||o.enumerable});return e};var _r=(e,t,n)=>(n=e!=null?E2(R2(e)):{},M2(t||!e||!e.__esModule?sS(n,"default",{value:e,enumerable:!0}):n,e));var de,F=P2(()=>{de=[{date:"2026-10-19",items:["**Set a VLAN on many switch ports at once.** In the device editor, tick the ports you want (Shift-click ticks a whole range, **All** ticks every network port), then pick the VLAN once from the bar above the list and every ticked port takes it. The same bar makes them **ACCESS** or **TRUNK**, tags VLANs on all of them, puts them in a **LAG**, or clears their VLANs.","**Duplicate check before you share a symbol.** Pressing **\u21E1** now checks your symbol against the built-in library, the shared library and submissions still waiting for review. A symbol with the same name as one that exists can't be sent again (if the existing one is wrong, use **\u2691 Suggest a fix** on it instead). If yours only looks like one that exists, you'll see which, and you can still send it once you've confirmed it's a different device.","**Portrait or landscape.** Export \u2192 pick a page size, then **TURN** it to **PORTRAIT** or **LANDSCAPE**. The page frame on every sheet turns where it stands, keeping its print scale, and Print, Download PDF and the SVG all come out that way round. It's saved with the project, and `Ctrl+Z` turns it back.","**Zones keep their see-through tint in PDFs.** A zone came out of **Download PDF** as a solid block of its colour, hiding everything inside it. It now prints as the same light wash you see on screen, and so does the white backing behind text notes.","**Duplicate warning shows on top.** Submitting from the **Share your symbols** window put the duplicate warning behind it, so it looked like nothing happened. It now opens in front.","**A symbol can only be sent once.** Pressing **\u21E1** on a symbol that is already waiting for review, or that was turned down, now says so instead of opening GitHub again. Renaming it doesn't get round it: it's recognised as the same symbol.","**The share reminder only offers symbols worth sending.** The **Share your symbols** window that opens when the app starts listed every symbol you'd made, including ones already sent, turned down or already in the library. It now leaves those out (and says how many), and doesn't open at all when there's nothing left to share."]},{date:"2026-10-15",items:["**Fixed: big symbols could not be submitted to the shared library.** GitHub refuses a link that long, so a symbol with more than about 37 ports opened an error page instead of an issue. Now a symbol that big is copied to your clipboard (or downloaded, if the clipboard is blocked) and the issue opens ready for you to paste it in. Submissions also keep the gaps between port groups and a modular symbol's card slots.",`**Download PDF.** A new button in the Export menu saves a real PDF at the page size you picked (A4, A3 or A2), whatever printer you have. Before, the only way was Print, and on a Mac "Save as PDF" in the print window is limited to your printer's paper sizes, so an A2 sheet could not be saved at A2. Text in the PDF stays text, in SignalFlow's own fonts. The first one takes a few seconds while the PDF tools load.`,"**Fixed: cable arrowheads were missing from SVG files and prints.** They are back.","**Copy, paste and duplicate work on notes and zones.** `Ctrl+C` / `Ctrl+V` / `Ctrl+D` used to copy only symbols. Shift-click, the selection box and `Ctrl+A` now pick up notes and zones too, and dragging a mixed selection moves all of it.","**Fixed: a sheet with only notes on it could not be exported.** SVG, Print and PDF were greyed out until the sheet had a symbol.","**Longer port labels.** A port name can now be up to 24 characters (it was 15), in New symbol, the device editor, Add multiple and the shared library. If the labels on the two sides of a narrow symbol start to meet, make the symbol wider.","**Suggest a fix for any symbol.** Spotted a mistake in a built-in or shared-library symbol? Double-click a placed one, correct its ports in the editor, then use **\u2691 Suggest a fix** at the bottom: say what's wrong (and link the spec sheet if you have it) and send it. It goes to the maintainer to check, so nothing changes for anyone until it's approved, and your own drawing is never touched by sending it."]},{date:"2026-10-14",items:["**disguise IP-VFC split into IP and SDI cards.** An IP-VFC outputs either ST 2110 or SDI, never both, so the one card that showed both is now two in every VX, GX and EX VFC slot: **IPVFC IP (2110)** (primary port plus the 2022-7 redundant port) and **IPVFC SDI 2X 12G** (SDI 1 and SDI 2). Placed devices that already had an IP-VFC keep it as the IP card."]},{date:"2026-10-13",items:["**Move ports up and down a symbol.** Every port row in New symbol, the device editor and the AI preview has a grip to drag it anywhere in the list, and \u25B2 \u25BC arrows that move it one place up or down its side of the symbol. Add a port at the end, then move it next to the others of its kind. Cables stay connected, and a card's ports stay inside their slot."]},{date:"2026-10-12",items:["**Fixed: cables keep the old type when you retype a port.** Changing a port from network to fibre (or any other type) in the device editor now changes the cables plugged into it too, so they draw, filter and list as the new type. It works whichever end you edit, for one device, every copy or the library symbol, and one `Ctrl+Z` undoes the port and its cables together.","**Generic monitors and a speaker.** Under Display: a **generic monitor** (HDMI, DisplayPort and USB-C in), a **generic SDI monitor** (two 12G-SDI inputs with loop-outs, HDMI, 12V on a 4-pin XLR) and a **generic large display** (three HDMI and a DisplayPort in, LAN and RS-232 control). Under Audio: a **generic active speaker** with one XLR input, for a Genelec-style powered monitor. For when the exact model does not matter.","**The whole NETGEAR M4250, M4350 and M4500 range.** All 13 M4250 (NETGEAR's AV Line), all 18 M4350 and both M4500 switches are in the library under Network, 33 in all, from NETGEAR's installation guides and datasheets. Every port is numbered as on the panel, PoE ports are marked PoE+ or PoE++ (so the Power view lights what they feed), and each has its management, console and USB ports and its real power inputs: the external 54V adapter on the desktop models, two or three PSUs where the switch has them, and the empty APS bays on the M4350.","**Switch config: right port names for each NETGEAR family.** NETGEAR's CLI reference says an M4250 on current firmware names its ports **0/1, 0/2\u2026**, not 1/0/1, so the change set now writes `interface 0/1` for an M4250 (including a shared-library M4250 symbol). The M4350 keeps 1/0/1. An M4500 gets its own syntax, since it has none of the `vlan participation` commands. The management address now uses `ip management vlan`, the command in the current reference. You can still override the naming per switch in the device editor.","**NETGEAR AV Line M4250-8G2XF-PoE+.** The 8-port PoE+ switch with two 10G SFP+ uplinks, under Network: eight PoE+ ports, SFP+ 9 and 10, the management and console ports and its 54V power input. **Lists > Switch config** numbers it the way NETGEAR does, 1/0/1 to 1/0/10.","**Fixed: switch config numbered the management port.** The out-of-band management socket was given an interface number (1/0/11 on an 8-port switch, 1/0/31 on the M4250-26G4F). It is a separate service port on NETGEAR, so it is now left out of the port map and the change set.","**Computers.** A new library category for the PCs around a show: the **Minisforum MS-A2** and **MS-A1**, the **ASUS NUC 14 Pro** (what the Intel NUC became), and three generic ones, a **mini PC**, a **workstation with a 4-output graphics card** and a **laptop**, for when the exact model does not matter. USB-C and Thunderbolt ports that carry DisplayPort are drawn as video outputs, so a cable from one to a screen or a converter reads as video.","**Blackmagic Micro Converter BiDirectional SDI/HDMI, 12G and 3G.** SDI to HDMI and HDMI to SDI at the same time, each with SDI in and out, HDMI in and out and USB-C power, from Blackmagic's tech specs. Under Control with the other Blackmagic converters."]},{date:"2026-10-10",items:["**Fixed: a Restore offer for a drawing you never touched.** Opening SignalFlow, changing nothing and coming back later asked whether to restore the previous session. It now only offers that once you have actually drawn something.","**Live sessions: draw together.** Click **SESSION** in the toolbar, put in your name and **Start a session**, then send the link. Everyone who opens it edits the same drawing at the same time, on the same sheet or on different ones. You see each other's cursors and what each person has selected, in their own colour, and the toolbar shows who is in. `Ctrl+Z` only takes back your own changes, never someone else's. If the connection drops you keep drawing, and your changes go through when it comes back. Nothing to install: it runs on SignalFlow's session server, and a session is kept for 30 days after the last edit. **Leave session** keeps the drawing open on your screen; save a file as well if you want your own copy."]},{date:"2026-10-09",items:["**Trace a signal end to end.** Select a cable (or a whole device) and press `T`, or **Trace** in the toolbar, and its path lights up while everything else fades: back to the source, forward to every destination, through converters, fibre and AV-over-IP, and onto other sheets (the chip at the top left has a button for each sheet the path continues on). Through a switch it follows the stream, so a decoder traces back to the encoders and not to the Dante node on the next port, while a plain LAN or control cable stops at the switch rather than lighting up the whole network. `T` or `Esc` stops.","**Zones carry what is in them.** Drag a zone and the devices, notes and smaller zones inside it move with it, cable bends included, so a whole rack or position moves in one go. Select a zone to see what it will take along. Hold `Alt` while dragging to move just the zone, to fit it around the kit again. One `Ctrl+Z` puts it all back.","**Switch ports pick up the VLAN of what you plug in.** If a device port already has a VLAN (from its symbol, or set in the device editor), cabling it to an empty switch port sets that switch port to the same VLAN, ready for the switch config and the patch sheet. A switch port that already has a VLAN, or is a trunk, is never changed: you get a warning if the two disagree. Works with **Link\u2026** too, and one `Ctrl+Z` undoes the cable and the VLAN. Turn it off in Settings if you would rather set switch ports by hand.","**Fill switch ports.** For cables drawn before that, the VLAN registry has a **Fill switch ports** button. It does the same for every cable already on the drawing, in one step you can undo. It shows how many ports it will set, and lists any that disagree with their device without changing them.","**Moving a cable end counts too.** Dragging a cable end onto a different, empty switch port gives that port the device\u2019s VLAN."]},{date:"2026-10-08",items:["**VLAN lists in and out.** The VLAN registry has **Import\u2026**, **Export** and **CSV**. Hand a house VLAN plan to another crew as a file, or bring one in from the network person's spreadsheet: VLAN, NAME, SUBNET, FROM, COLOUR, with or without a header row. Import only adds: a VLAN number you already have is left exactly as it is.","**Back to the library version.** A device whose ports you edited by hand has a **\u21BA Library version** button in its editor. It puts the ports and width back to the library symbol and keeps the VLAN, trunk, LAG and IP settings on its ports. It warns you if a port only that device had (and any cable on it) will go.","**Replace several devices at once.** Select them all (eight encoders, say) and press `R` or **Replace\u2026**. Every device is worked out on its own and the list ranks symbols by how many cables they keep across the lot. A table shows any device that would lose a cable or a VLAN setting. One `Ctrl+Z` undoes the whole swap.","**New VLANs get their own colours.** VLANs numbered 10, 20, 30\u2026 all came out the same blue. Each VLAN you add now takes a colour no other VLAN is using. If an existing project already has several on one colour, the registry offers a button to give each its own.","**Numbered ports can start anywhere.** Add multiple has a **from** box: set 25 to add PORT 25\u201326 for the 1G pair on a 24+2 switch. Leave it blank to carry on from the last number as before.","**Cable numbers stay put.** A cable keeps its number for good, so labels you have already printed stay right: a new cable takes the next free number instead of shifting everything after it, and deleting one leaves a gap rather than renumbering the rest. Older projects are numbered on open exactly as their lists printed before. Breakout legs still share their DAC's number. **Renumber\u2026** in Lists \u2192 Cables starts again from C001 when you want a clean set. A selected cable shows its number, and `Ctrl+F` finds a cable by the label in your hand (`C13`, `C013-2`).","**Only the left button moves things.** Middle-drag now pans the sheet even when it starts on a symbol, and a right-click no longer drags a symbol, note or cable end around.","**40G breakouts into SFP28 ports.** A QSFP+ 4\xD7 10G breakout DAC can now land its tails in SFP28 ports as well as SFP+ ones \u2014 even a mix on the same cable. Those legs carry the note *SFP+ leg in SFP28 port \xB7 runs at 10G*.","**QSFP+ into a QSFP28 port is allowed.** A 100G QSFP28 port takes a 40G QSFP+ module, so that cable now links with the note *QSFP+ module in QSFP28 port \xB7 runs at 40G*, the same way SFP+ into SFP28 does.","**Shortcuts work on every keyboard layout.** On Russian, Greek, Hebrew and other non-Latin layouts the letter shortcuts did nothing \u2014 `Ctrl+Z` and `Ctrl+S` included \u2014 and now work from the same keys. On French (AZERTY) keyboards the number shortcuts work without Shift: hold `1` / `2` / `3` while clicking a port, and `0` to reset the zoom. Letter shortcuts still follow the letter printed on your key, so `Ctrl+Z` is the key labelled Z, as in every other app.","**Replacing a switch keeps the VLANs on unpatched ports too.** Ports you had set up with a VLAN, trunk, LAG or IP before anything was plugged in now move to the new switch as well \u2014 same port name where it exists, otherwise the next free port. They are listed in the Replace table under the cables, can be moved by hand, and if the new switch has no room for some of them the window says so before you commit.",'**Pressing `R` no longer types an "r" into the Replace search.** The window opens with an empty search box, ready to type.',"**SFP+ into an SFP28 port is allowed.** A 25G SFP28 port takes a 10G SFP+ module, so that cable now links instead of being refused, with the note *SFP+ module in SFP28 port \xB7 runs at 10G* in the popover and the cable list.","**Replace a symbol and keep its cables.** Select a device and press `R` (or **Replace\u2026** in the toolbar, or in the device editor) to swap it for a different symbol \u2014 a 48-port switch for a 16-port one, a Videohub 40x40 for a 20x20. Each cable moves to a matching port on the new symbol: same name first, then the same kind of port in order, so cables on ports 40 and 41 land on the next free ports rather than anywhere. The list shows up front whether each symbol **fits all** your cables, fits only with adapters, or **drops** some, and a table shows where every cable will go \u2014 change any of them by hand. If a cable has nowhere to go, it says so in red before you commit, and `Ctrl+Z` brings everything back. The device keeps its name and IP, and each port's VLAN, trunk and LAG settings move with its cable.","**Choose where your project is saved.** **Save** now asks where to put the file and what to call it, instead of dropping it in Downloads. After that the project remembers its file: the next **Save** (`Ctrl+S`) asks whether to **overwrite** it or **save as a new file** \u2014 press `Enter` to overwrite. **Save as** (`Ctrl+Shift+S`) always asks for a new location. Opening a project links it to that file too, and the status bar shows which file you are working on. Works in Chrome and Edge; Firefox and Safari still download a copy, as before.","**Windows no longer close when a drag ends outside them.** Selecting text in a field and letting go past the edge of the window used to count as a click on the background, closing it and losing whatever you had typed. A window now closes only on a real click outside it, or its close button."]}]});var xS=gr(je=>{"use strict";F();var ul=Symbol.for("react.element"),U2=Symbol.for("react.portal"),B2=Symbol.for("react.fragment"),$2=Symbol.for("react.strict_mode"),H2=Symbol.for("react.profiler"),F2=Symbol.for("react.provider"),G2=Symbol.for("react.context"),_2=Symbol.for("react.forward_ref"),V2=Symbol.for("react.suspense"),z2=Symbol.for("react.memo"),W2=Symbol.for("react.lazy"),lS=Symbol.iterator;function j2(e){return e===null||typeof e!="object"?null:(e=lS&&e[lS]||e["@@iterator"],typeof e=="function"?e:null)}var cS={isMounted:function(){return!1},enqueueForceUpdate:function(){},enqueueReplaceState:function(){},enqueueSetState:function(){}},fS=Object.assign,pS={};function bi(e,t,n){this.props=e,this.context=t,this.refs=pS,this.updater=n||cS}bi.prototype.isReactComponent={};bi.pro
