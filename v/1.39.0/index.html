<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalFlow — AV Signal Schematic Editor</title>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div id="root"></div>
<script>
// Outside claude.ai the Anthropic API needs your own key. Asked once, kept in this
// browser's localStorage only. Delete with: localStorage.removeItem("sf_api_key")
// Feedback endpoint: paste a Formspree / Tally / Apps Script URL here and the
// in-app feedback form posts JSON to it. Left empty it offers a GitHub issue.
window.SF_FEEDBACK_URL = "";
(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
      var key = localStorage.getItem("sf_api_key");
      if (!key) {
        key = window.prompt("Anthropic API key for the AI symbol analyzer (sk-ant-...):\nStored only in this browser. Cancel to skip — everything else works without it.");
        if (key) localStorage.setItem("sf_api_key", key.trim());
      }
      if (key) {
        opts = opts || {};
        var h = opts.headers || {};
        h["x-api-key"] = key.trim();
        h["anthropic-version"] = "2023-06-01";
        h["anthropic-dangerous-direct-browser-access"] = "true";
        opts.headers = h;
      }
    }
    return orig(url, opts);
  };
})();
</script>
<script>(()=>{var jT=Object.create;var dw=Object.defineProperty;var qT=Object.getOwnPropertyDescriptor;var JT=Object.getOwnPropertyNames;var KT=Object.getPrototypeOf,YT=Object.prototype.hasOwnProperty;var QT=(e,t)=>()=>(e&&(t=e(e=0)),t);var ia=(e,t)=>()=>(t||e((t={exports:{}}).exports,t),t.exports);var ZT=(e,t,n,o)=>{if(t&&typeof t=="object"||typeof t=="function")for(let a of JT(t))!YT.call(e,a)&&a!==n&&dw(e,a,{get:()=>t[a],enumerable:!(o=qT(t,a))||o.enumerable});return e};var Ga=(e,t,n)=>(n=e!=null?jT(KT(e)):{},ZT(t||!e||!e.__esModule?dw(n,"default",{value:e,enumerable:!0}):n,e));var Re,re=QT(()=>{Re=[{date:"2026-11-06",items:["**Drag a flag to another port.** A flag can be picked up and dropped on another port, the way a cable's end dot can: the end the flag sits on moves there and the flag goes with it, drawn over the port it would land on while you drag. It works on both flags of a flag link and on an off-page reference, from either sheet. A click still selects the link, a double-click on an off-page reference still goes to the far sheet, and a port the cable cannot plug into is refused with the usual message. `Ctrl+Z` undoes it.","**Hold `1`, `2` or `3` and click a connection to change its type.** The keys that pick the type of a new cable now change an existing one: hold `1` and click a flag and it becomes a direct cable, hold `3` and click a cable, or a port with a cable on it, and it becomes flags, hold `2` for a routed cable (its elbow becomes a bend you can drag). A port with several cables on it changes them all. An off-page reference joins two sheets, so it stays flags and says so. One undo step.","**End dots on an off-page reference.** Selecting an off-page reference now shows the end dot of the end that is on this sheet, so that end can be dragged like any cable's."]},{date:"2026-11-01",items:["**Pictures on the sheet.** The new **Image** button, next to Zone and Note, puts a photo, a plan or a page of a PDF on the sheet: a stage camera plot, a venue plan, a photo of the rack. You can also paste a screenshot with `Ctrl+V`, or drop picture files on the paper. A PDF with more than one page asks which page you want.","**Size, fade, layer and lock.** Drag a corner to size a picture; it keeps its shape unless you hold `Shift`. The bar above it fades it so the drawing reads over it, puts it behind the cables and symbols (where it starts) or in front of them (`[` and `]` do the same), and locks it: a locked picture stays put and clicks go through it, so you can draw on top of a plan without moving it. Click the small lock in its corner to select it again.","**Pictures go wherever the drawing goes.** They are saved in the project file and auto-saved with it, print, and come out in SVG and Download PDF. They copy and paste, move with a zone they sit inside, and show for everyone in a live session. Large photos are scaled down as they come in (2400 px across at most, 3000 for a PDF page), so the project file stays a sensible size.","**Older versions** open a drawing with pictures, but show nothing where they are and save the file without them.","**A tidier toolbar, on one row.** Open, Save, Save as and Import PDF are under **File**, and Replace, Link, Trace, Straighten, Bring to front and Send to back under **Tools**, each with its key beside it. Save keeps a button of its own next to Undo. In a narrow window the labels give way to icons (hover one for its name) instead of the toolbar spilling onto a second row.",'**`Esc` says no** to the question Save asks (overwrite the file, or save it as a new one?) and to "Replace connection?", the way it shuts other dialogs. Before, the question stayed open.']},{date:"2026-10-27",items:["**Cables run straight.** Ports now sit on the same 8 px grid as everything you place, so two ports facing each other can always line up and the cable between them runs straight. Before, the grid (10 px) and the spacing of ports (16 px) didn't agree, so most cables kept a small step however carefully the boxes were placed.","**Drag a box near level and it snaps.** Dragging a device to within a few pixels of a straight cable snaps it straight, with a guide line while you drag.","**Straighten (`S`).** A new toolbar button straightens the cables on the sheet that are a few pixels out of line, or only the selected devices' cables, by moving devices up or down. Cables a row or more apart are left as you drew them, a cable already straight stays straight, and nothing is pushed onto another box. One undo step.","**Older drawings don't move when you open them.** Press `S` on a sheet to tidy its near misses. Imported PDFs now come in with the cables that ran straight on the page straight.","**Lists as PDF.** Lists now has **PDF \u2014 all lists** and a PDF of the list you're looking at, A4 landscape, with the header row repeated on every page and page numbers. It follows the LANGUAGE choice like the CSV does.","**Lists for just the selection.** Select devices or cables on the drawing, open Lists and pick **SELECTION**: the equipment, the cables to and from those devices and the ports of any selected switch, on screen, in the CSV and in the PDF.","**Tidier buttons in Lists.** The export buttons at the foot of Lists sit on one line again, short and the same size: CSV and PDF for the list you're on, PDF and HTML for all lists. Hover one to see exactly what it makes.","**Small things you may notice:** the paper grid is finer, the arrow keys nudge one grid step (8 px, or 40 with Shift), and the slot headers on modular symbols are a little taller so the ports below them stay on the grid."]},{date:"2026-10-26",items:["**SignalFlow in eleven more languages.** The interface now comes in \u0420\u0443\u0441\u0441\u043A\u0438\u0439, Deutsch, Fran\xE7ais, Espa\xF1ol, Portugu\xEAs (Brasil), Italiano, Polski, \u65E5\u672C\u8A9E, \u7B80\u4F53\u4E2D\u6587, \u7E41\u9AD4\u4E2D\u6587 and \uD55C\uAD6D\uC5B4: pick one under Settings \u2192 LANGUAGE, or take the offer SignalFlow makes the first time it opens in a browser set to one of them (Taiwan and Hong Kong are offered Traditional Chinese). Symbol names and port labels stay in English. The translations are new: if something reads wrong, the link under LANGUAGE in Settings tells us.",`**Drawings and lists in your language, in English, or both.** A LANGUAGE row in the Export menu and in Lists (EXPORTS in Settings) sets the language of what SignalFlow writes itself: the legend's line names, the title block's captions, the list headings, cable types and signal names. English stays the default; pick your language, or both side by side ("PROJECT / \u041F\u0420\u041E\u0415\u041A\u0422") for a mixed crew. Names, port labels and anything you type stay as they are, and the drawing on screen shows what will print.`,"**Japanese, Chinese and Korean input.** The fields that capitalise as you type (names, labels, the title block) now wait while an input method is composing, so romaji and pinyin convert as they should.","**Cyrillic, Japanese, Chinese and Korean in Download PDF.** A device named in Russian or Japanese, or anything else written in Cyrillic, Greek, Chinese or Korean, came out of Download PDF blank. It now prints as it shows on screen. The first PDF with Japanese, Chinese or Korean on it takes a few seconds longer while the font loads.",'**Counts read right.** Messages that said "1 devices" or "1 cables" now say "1 device" and "1 cable".',"**A folded switch keeps its spare ports in the list.** Collapsing a switch to its patched ports on the drawing also dropped its free ports from Lists \u2192 SWITCH PORTS, the list that shows what is still spare. They're listed again."]},{date:"2026-10-25",items:["**Audio symbols.** 66 new built-ins, every port taken from the maker's own manual or data sheet. Consoles and stage boxes: Yamaha CL, QL, DM7 and Rio; Allen & Heath dLive, DX168 and DX32; Midas DL16, DL32 and M32 LIVE; DiGiCo SD-Rack and Quantum 338, with their I/O cards ready to fit in the slots. Wireless: Shure Axient Digital, ULX-D, PSM1000, antenna distribution and combiner; Sennheiser EW-DX, Digital 6000 and SR IEM G4. Amps and processing: d&b D80, D40 and DS10; L-Acoustics LA12X, LA4X, LA7.16, P1 and LS10; Meyer GALAXY 816; Focusrite RedNet and DirectOut EXBOX.MD. Loudspeakers from L-Acoustics and d&b, Clear-Com FreeSpeak II and Encore intercom, and generic mics, DI boxes, splitters, passive speakers and a four-channel amp.","**Lighting symbols.** 66 more: grandMA3 consoles, processing units, wings and nodes; ETC Eos Apex (its I/O Garage as slots), Ion Xe and Element with Response gateways; Tour, Stage, Flex and Gig Hog and the HPU+; Avolites D9, D7, Arena and Titan Net Processor; ChamSys MagicQ and GeNetix; Luminex LumiNode, LumiSplit and GigaCore; Swisson, DMXking, ELC and ENTTEC nodes; the Visual Productions TimeCore; generic nodes, splitters, a merger, a terminator and DMX fixtures; and a 63 A three-phase distro with a Socapex breakout.","**The grandMA3 console is the real one.** The old built-in was a placeholder with an IEC inlet, two etherCON and two DMX outputs. It's now the grandMA3 full-size as MA builds it: powerCON TRUE1, three etherCON, six DMX outs and a DMX in, MIDI, LTC and the rest. Cables already on it stay on the same ports.","**DMX, timecode, speaker and RF cables look different.** DMX is now a solid purple line, with DMX512 under CONTROL in the legend, and DMX ports on symbols turn purple too. Timecode (LTC) gets its own dash. speakON speaker cables draw heavier, and antenna coax has its own RF style. Change any of them from the legend like any other row.","**Speaker breakouts.** An amp's NL8 output feeds up to four NL4 boxes (an L-Acoustics SC32 up to eight) as one breakout cable: one cable number, a lane per leg, and the breakout named in the cable list.","**Safer links.** DMX on RJ45, AES50, ULTRANET, intercom 4-wire and d&b CAN all use RJ45 or etherCON but aren't Ethernet, and SignalFlow now refuses to patch them into a network switch and says why. A 3-pin to 5-pin DMX link is allowed with the adapter named in the cable list, and so is an XLR link into an input that switches to AES3.","**New connectors** to go with them: speakON NL4 and NL8, L-Acoustics CA-COM, PA-COM and SC32, AES50, ULTRANET, antenna coax, word clock BNC, TOSLINK, DB25, RCA, 3.5 mm, DMX on RJ45 and on terminals, D-SUB 9, VGA, and stage power: CEE 16 to 125 A, Socapex, Powerlock, Cam-Lok, Schuko and 32 A powerCON.","**DMX universes.** Give a console's or node's DMX outputs a universe in the device editor (with sACN or Art-Net when it comes off the network), one at a time or **Number** them all in order. The universe shows under the port, and every cable downstream carries it: through fixture THRUs, splitters and a main/backup merger. A cable that starts a run without a label, like a splitter output, gets a small tag, so a chain of fixtures isn't a column of labels. The cable list gains a UNIVERSE column, and `Ctrl+F` finds `U2`, `SACN 2` or `ART-NET 0`.","**Port settings stay on the device.** When you only change VLAN, IP, LAG or universe settings, **This instance only** is now the highlighted choice, so two nodes don't end up sending the same universes by accident.","**Every symbol has a class.** As well as its category, each symbol now belongs to a class: VIDEO, AUDIO, LIGHTING, NETWORK, CONTROL or POWER. The funnel next to the library search filters by class, any mix of them, together with the search, and carries a count while a filter is on. Each category in the sidebar shows the class it belongs to as a coloured edge. A class goes by what a box is for, not just its sockets, so a lighting desk with monitor outputs stays out of VIDEO and the Blackmagic switchers filed under Control show up in it.","**The library opens folded.** Every category starts collapsed each time you open SignalFlow, instead of coming back the way you last left it."]},{date:"2026-10-24",items:["**Lower case text.** Settings has a new **DRAWING** section, saved with the project. Set **CASE** to **As typed** and device names, sheet names, zone titles, the legend, VLAN names and the title block keep the case you type them in. Symbol and port names stay in capitals, since they're shared with everyone through the symbol library. Switching back to **CAPITALS** puts what you typed into capitals (`Ctrl+Z` undoes it).","**Your own fonts.** Also under **DRAWING**: pick a font for the drawing's text and one for its headings. Use any free font from Google Fonts by typing its name, or load a .ttf or .otf file from your computer. The font is used on screen, in SVG, in Print and in Download PDF. A font that sets wider than the default is drawn a little smaller, so names still fit their boxes. A font file stays on your computer and only its name goes in the project, so whoever opens the drawing needs it too, or sees the default. Check that your font's licence lets you use it this way.","**New categories.** When you make a symbol, the category list has **+ New category\u2026**. The new category shows up in the library sidebar straight away, and when you share the symbol with \u21E1 the category goes with it.","**Suggest a category.** At the bottom of the library sidebar: name a new category, or pick one that exists, and tick the symbols that belong in it. Built-in and shared symbols go to the maintainer to review on GitHub, and once approved every SignalFlow files them there. Your own symbols move straight away.","**Terms of use.** SignalFlow now has terms of use, linked from Settings and the website. Among other things they say who is responsible for the licences of fonts you load.","**Multi-page PDFs join up.** A flag on one page that names a device on another page of the same PDF now becomes a real cable: an off-page cable between the new sheets, or an ordinary flag pair when you add every page to one sheet. Only a flag that names nothing in the PDF gets an OFF-SHEET placeholder now.","**Import a PDF schematic.** **Import PDF** in the toolbar turns a schematic saved as PDF from Vectorworks, Stardraw, AutoCAD, Visio and the like into devices, ports and cables you can edit. Every box becomes a device with its ports and name, the cables join up port to port, and off-sheet flags are matched to the device they name and drawn as off-page flags. Anything a flag names that isn't on the page (a wall outlet, a patch panel in another room) becomes an **OFF-SHEET** placeholder so the cable isn't lost, and the drawing's zones come in as zone boxes. Before anything changes you see what was found, and you choose a **new sheet**, **add to this sheet** or **replace this sheet**. Where the library already has a device of the same name you can use it instead, and its cables move across. It reads the drawing's own lines and text, so it needs a PDF saved from a drawing program, not a scan. `Ctrl+Z` undoes the whole import.","**Cables keep out from under flags.** Where a cable bends between two devices, the bend now goes to the nearest spot clear of any off-page flag, so the flag text stays readable. When there's no clear spot, the cable stays where it was.","**Imported zones no longer overlap.** Each zone from an imported PDF is now drawn around what it actually holds, and where that makes two zones run into each other, the later one moves right or down, contents and all, until they're clear.","**More room for flags on imported sheets.** An imported device now gets room for its flags beside it, so a cable between two closely drawn devices (a patch panel and what it feeds, say) can still run clear of them. The same now applies to cables that go out and around a device, not only ones that bend once."]},{date:"2026-10-19",items:["**Set a VLAN on many switch ports at once.** In the device editor, tick the ports you want (Shift-click ticks a whole range, **All** ticks every network port), then pick the VLAN once from the bar above the list and every ticked port takes it. The same bar makes them **ACCESS** or **TRUNK**, tags VLANs on all of them, puts them in a **LAG**, or clears their VLANs.","**Duplicate check before you share a symbol.** Pressing **\u21E1** now checks your symbol against the built-in library, the shared library and submissions still waiting for review. A symbol with the same name as one that exists can't be sent again (if the existing one is wrong, use **\u2691 Suggest a fix** on it instead). If yours only looks like one that exists, you'll see which, and you can still send it once you've confirmed it's a different device.","**Portrait or landscape.** Export \u2192 pick a page size, then **TURN** it to **PORTRAIT** or **LANDSCAPE**. The page frame on every sheet turns where it stands, keeping its print scale, and Print, Download PDF and the SVG all come out that way round. It's saved with the project, and `Ctrl+Z` turns it back.","**Zones keep their see-through tint in PDFs.** A zone came out of **Download PDF** as a solid block of its colour, hiding everything inside it. It now prints as the same light wash you see on screen, and so does the white backing behind text notes.","**Duplicate warning shows on top.** Submitting from the **Share your symbols** window put the duplicate warning behind it, so it looked like nothing happened. It now opens in front.","**A symbol can only be sent once.** Pressing **\u21E1** on a symbol that is already waiting for review, or that was turned down, now says so instead of opening GitHub again. Renaming it doesn't get round it: it's recognised as the same symbol.","**The share reminder only offers symbols worth sending.** The **Share your symbols** window that opens when the app starts listed every symbol you'd made, including ones already sent, turned down or already in the library. It now leaves those out (and says how many), and doesn't open at all when there's nothing left to share."]},{date:"2026-10-15",items:["**Fixed: big symbols could not be submitted to the shared library.** GitHub refuses a link that long, so a symbol with more than about 37 ports opened an error page instead of an issue. Now a symbol that big is copied to your clipboard (or downloaded, if the clipboard is blocked) and the issue opens ready for you to paste it in. Submissions also keep the gaps between port groups and a modular symbol's card slots.",`**Download PDF.** A new button in the Export menu saves a real PDF at the page size you picked (A4, A3 or A2), whatever printer you have. Before, the only way was Print, and on a Mac "Save as PDF" in the print window is limited to your printer's paper sizes, so an A2 sheet could not be saved at A2. Text in the PDF stays text, in SignalFlow's own fonts. The first one takes a few seconds while the PDF tools load.`,"**Fixed: cable arrowheads were missing from SVG files and prints.** They are back.","**Copy, paste and duplicate work on notes and zones.** `Ctrl+C` / `Ctrl+V` / `Ctrl+D` used to copy only symbols. Shift-click, the selection box and `Ctrl+A` now pick up notes and zones too, and dragging a mixed selection moves all of it.","**Fixed: a sheet with only notes on it could not be exported.** SVG, Print and PDF were greyed out until the sheet had a symbol.","**Longer port labels.** A port name can now be up to 24 characters (it was 15), in New symbol, the device editor, Add multiple and the shared library. If the labels on the two sides of a narrow symbol start to meet, make the symbol wider.","**Suggest a fix for any symbol.** Spotted a mistake in a built-in or shared-library symbol? Double-click a placed one, correct its ports in the editor, then use **\u2691 Suggest a fix** at the bottom: say what's wrong (and link the spec sheet if you have it) and send it. It goes to the maintainer to check, so nothing changes for anyone until it's approved, and your own drawing is never touched by sending it."]}]});var ww=ia(It=>{"use strict";re();var Cd=Symbol.for("react.element"),tA=Symbol.for("react.portal"),nA=Symbol.for("react.fragment"),oA=Symbol.for("react.strict_mod
