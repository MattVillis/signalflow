<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalFlow — AV Signal Schematic Editor</title>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div id="root"></div>
<script>
// Outside claude.ai the Anthropic API needs your own key. Asked once, kept in this
// browser's localStorage only. Delete with: localStorage.removeItem("sf_api_key")
// Feedback endpoint: paste a Formspree / Tally / Apps Script URL here and the
// in-app feedback form posts JSON to it. Left empty it offers a GitHub issue.
window.SF_FEEDBACK_URL = "";
(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
      var key = localStorage.getItem("sf_api_key");
      if (!key) {
        key = window.prompt("Anthropic API key for the AI symbol analyzer (sk-ant-...):\nStored only in this browser. Cancel to skip — everything else works without it.");
        if (key) localStorage.setItem("sf_api_key", key.trim());
      }
      if (key) {
        opts = opts || {};
        var h = opts.headers || {};
        h["x-api-key"] = key.trim();
        h["anthropic-version"] = "2023-06-01";
        h["anthropic-dangerous-direct-browser-access"] = "true";
        opts.headers = h;
      }
    }
    return orig(url, opts);
  };
})();
</script>
<script>(()=>{var Xb=Object.create;var S0=Object.defineProperty;var Jb=Object.getOwnPropertyDescriptor;var Kb=Object.getOwnPropertyNames;var Yb=Object.getPrototypeOf,Qb=Object.prototype.hasOwnProperty;var Zb=(e,t)=>()=>(e&&(t=e(e=0)),t);var Cr=(e,t)=>()=>(t||e((t={exports:{}}).exports,t),t.exports);var e2=(e,t,n,o)=>{if(t&&typeof t=="object"||typeof t=="function")for(let r of Kb(t))!Qb.call(e,r)&&r!==n&&S0(e,r,{get:()=>t[r],enumerable:!(o=Jb(t,r))||o.enumerable});return e};var Jr=(e,t,n)=>(n=e!=null?Xb(Yb(e)):{},e2(t||!e||!e.__esModule?S0(n,"default",{value:e,enumerable:!0}):n,e));var be,K=Zb(()=>{be=[{date:"2026-10-24",items:["**Multi-page PDFs join up.** A flag on one page that names a device on another page of the same PDF now becomes a real cable: an off-page cable between the new sheets, or an ordinary flag pair when you add every page to one sheet. Only a flag that names nothing in the PDF gets an OFF-SHEET placeholder now.","**Import a PDF schematic.** **Import PDF** in the toolbar turns a schematic saved as PDF from Vectorworks, Stardraw, AutoCAD, Visio and the like into devices, ports and cables you can edit. Every box becomes a device with its ports and name, the cables join up port to port, and off-sheet flags are matched to the device they name and drawn as off-page flags. Anything a flag names that isn't on the page (a wall outlet, a patch panel in another room) becomes an **OFF-SHEET** placeholder so the cable isn't lost, and the drawing's zones come in as zone boxes. Before anything changes you see what was found, and you choose a **new sheet**, **add to this sheet** or **replace this sheet**. Where the library already has a device of the same name you can use it instead, and its cables move across. It reads the drawing's own lines and text, so it needs a PDF saved from a drawing program, not a scan. `Ctrl+Z` undoes the whole import.","**Cables keep out from under flags.** Where a cable bends between two devices, the bend now goes to the nearest spot clear of any off-page flag, so the flag text stays readable. When there's no clear spot, the cable stays where it was.","**Imported zones no longer overlap.** Each zone from an imported PDF is now drawn around what it actually holds, and where that makes two zones run into each other, the later one moves right or down, contents and all, until they're clear.","**More room for flags on imported sheets.** An imported device now gets room for its flags beside it, so a cable between two closely drawn devices (a patch panel and what it feeds, say) can still run clear of them. The same now applies to cables that go out and around a device, not only ones that bend once."]},{date:"2026-10-19",items:["**Set a VLAN on many switch ports at once.** In the device editor, tick the ports you want (Shift-click ticks a whole range, **All** ticks every network port), then pick the VLAN once from the bar above the list and every ticked port takes it. The same bar makes them **ACCESS** or **TRUNK**, tags VLANs on all of them, puts them in a **LAG**, or clears their VLANs.","**Duplicate check before you share a symbol.** Pressing **\u21E1** now checks your symbol against the built-in library, the shared library and submissions still waiting for review. A symbol with the same name as one that exists can't be sent again (if the existing one is wrong, use **\u2691 Suggest a fix** on it instead). If yours only looks like one that exists, you'll see which, and you can still send it once you've confirmed it's a different device.","**Portrait or landscape.** Export \u2192 pick a page size, then **TURN** it to **PORTRAIT** or **LANDSCAPE**. The page frame on every sheet turns where it stands, keeping its print scale, and Print, Download PDF and the SVG all come out that way round. It's saved with the project, and `Ctrl+Z` turns it back.","**Zones keep their see-through tint in PDFs.** A zone came out of **Download PDF** as a solid block of its colour, hiding everything inside it. It now prints as the same light wash you see on screen, and so does the white backing behind text notes.","**Duplicate warning shows on top.** Submitting from the **Share your symbols** window put the duplicate warning behind it, so it looked like nothing happened. It now opens in front.","**A symbol can only be sent once.** Pressing **\u21E1** on a symbol that is already waiting for review, or that was turned down, now says so instead of opening GitHub again. Renaming it doesn't get round it: it's recognised as the same symbol.","**The share reminder only offers symbols worth sending.** The **Share your symbols** window that opens when the app starts listed every symbol you'd made, including ones already sent, turned down or already in the library. It now leaves those out (and says how many), and doesn't open at all when there's nothing left to share."]},{date:"2026-10-15",items:["**Fixed: big symbols could not be submitted to the shared library.** GitHub refuses a link that long, so a symbol with more than about 37 ports opened an error page instead of an issue. Now a symbol that big is copied to your clipboard (or downloaded, if the clipboard is blocked) and the issue opens ready for you to paste it in. Submissions also keep the gaps between port groups and a modular symbol's card slots.",`**Download PDF.** A new button in the Export menu saves a real PDF at the page size you picked (A4, A3 or A2), whatever printer you have. Before, the only way was Print, and on a Mac "Save as PDF" in the print window is limited to your printer's paper sizes, so an A2 sheet could not be saved at A2. Text in the PDF stays text, in SignalFlow's own fonts. The first one takes a few seconds while the PDF tools load.`,"**Fixed: cable arrowheads were missing from SVG files and prints.** They are back.","**Copy, paste and duplicate work on notes and zones.** `Ctrl+C` / `Ctrl+V` / `Ctrl+D` used to copy only symbols. Shift-click, the selection box and `Ctrl+A` now pick up notes and zones too, and dragging a mixed selection moves all of it.","**Fixed: a sheet with only notes on it could not be exported.** SVG, Print and PDF were greyed out until the sheet had a symbol.","**Longer port labels.** A port name can now be up to 24 characters (it was 15), in New symbol, the device editor, Add multiple and the shared library. If the labels on the two sides of a narrow symbol start to meet, make the symbol wider.","**Suggest a fix for any symbol.** Spotted a mistake in a built-in or shared-library symbol? Double-click a placed one, correct its ports in the editor, then use **\u2691 Suggest a fix** at the bottom: say what's wrong (and link the spec sheet if you have it) and send it. It goes to the maintainer to check, so nothing changes for anyone until it's approved, and your own drawing is never touched by sending it."]},{date:"2026-10-14",items:["**disguise IP-VFC split into IP and SDI cards.** An IP-VFC outputs either ST 2110 or SDI, never both, so the one card that showed both is now two in every VX, GX and EX VFC slot: **IPVFC IP (2110)** (primary port plus the 2022-7 redundant port) and **IPVFC SDI 2X 12G** (SDI 1 and SDI 2). Placed devices that already had an IP-VFC keep it as the IP card."]},{date:"2026-10-13",items:["**Move ports up and down a symbol.** Every port row in New symbol, the device editor and the AI preview has a grip to drag it anywhere in the list, and \u25B2 \u25BC arrows that move it one place up or down its side of the symbol. Add a port at the end, then move it next to the others of its kind. Cables stay connected, and a card's ports stay inside their slot."]},{date:"2026-10-12",items:["**Fixed: cables keep the old type when you retype a port.** Changing a port from network to fibre (or any other type) in the device editor now changes the cables plugged into it too, so they draw, filter and list as the new type. It works whichever end you edit, for one device, every copy or the library symbol, and one `Ctrl+Z` undoes the port and its cables together.","**Generic monitors and a speaker.** Under Display: a **generic monitor** (HDMI, DisplayPort and USB-C in), a **generic SDI monitor** (two 12G-SDI inputs with loop-outs, HDMI, 12V on a 4-pin XLR) and a **generic large display** (three HDMI and a DisplayPort in, LAN and RS-232 control). Under Audio: a **generic active speaker** with one XLR input, for a Genelec-style powered monitor. For when the exact model does not matter.","**The whole NETGEAR M4250, M4350 and M4500 range.** All 13 M4250 (NETGEAR's AV Line), all 18 M4350 and both M4500 switches are in the library under Network, 33 in all, from NETGEAR's installation guides and datasheets. Every port is numbered as on the panel, PoE ports are marked PoE+ or PoE++ (so the Power view lights what they feed), and each has its management, console and USB ports and its real power inputs: the external 54V adapter on the desktop models, two or three PSUs where the switch has them, and the empty APS bays on the M4350.","**Switch config: right port names for each NETGEAR family.** NETGEAR's CLI reference says an M4250 on current firmware names its ports **0/1, 0/2\u2026**, not 1/0/1, so the change set now writes `interface 0/1` for an M4250 (including a shared-library M4250 symbol). The M4350 keeps 1/0/1. An M4500 gets its own syntax, since it has none of the `vlan participation` commands. The management address now uses `ip management vlan`, the command in the current reference. You can still override the naming per switch in the device editor.","**NETGEAR AV Line M4250-8G2XF-PoE+.** The 8-port PoE+ switch with two 10G SFP+ uplinks, under Network: eight PoE+ ports, SFP+ 9 and 10, the management and console ports and its 54V power input. **Lists > Switch config** numbers it the way NETGEAR does, 1/0/1 to 1/0/10.","**Fixed: switch config numbered the management port.** The out-of-band management socket was given an interface number (1/0/11 on an 8-port switch, 1/0/31 on the M4250-26G4F). It is a separate service port on NETGEAR, so it is now left out of the port map and the change set.","**Computers.** A new library category for the PCs around a show: the **Minisforum MS-A2** and **MS-A1**, the **ASUS NUC 14 Pro** (what the Intel NUC became), and three generic ones, a **mini PC**, a **workstation with a 4-output graphics card** and a **laptop**, for when the exact model does not matter. USB-C and Thunderbolt ports that carry DisplayPort are drawn as video outputs, so a cable from one to a screen or a converter reads as video.","**Blackmagic Micro Converter BiDirectional SDI/HDMI, 12G and 3G.** SDI to HDMI and HDMI to SDI at the same time, each with SDI in and out, HDMI in and out and USB-C power, from Blackmagic's tech specs. Under Control with the other Blackmagic converters."]},{date:"2026-10-10",items:["**Fixed: a Restore offer for a drawing you never touched.** Opening SignalFlow, changing nothing and coming back later asked whether to restore the previous session. It now only offers that once you have actually drawn something.","**Live sessions: draw together.** Click **SESSION** in the toolbar, put in your name and **Start a session**, then send the link. Everyone who opens it edits the same drawing at the same time, on the same sheet or on different ones. You see each other's cursors and what each person has selected, in their own colour, and the toolbar shows who is in. `Ctrl+Z` only takes back your own changes, never someone else's. If the connection drops you keep drawing, and your changes go through when it comes back. Nothing to install: it runs on SignalFlow's session server, and a session is kept for 30 days after the last edit. **Leave session** keeps the drawing open on your screen; save a file as well if you want your own copy."]},{date:"2026-10-09",items:["**Trace a signal end to end.** Select a cable (or a whole device) and press `T`, or **Trace** in the toolbar, and its path lights up while everything else fades: back to the source, forward to every destination, through converters, fibre and AV-over-IP, and onto other sheets (the chip at the top left has a button for each sheet the path continues on). Through a switch it follows the stream, so a decoder traces back to the encoders and not to the Dante node on the next port, while a plain LAN or control cable stops at the switch rather than lighting up the whole network. `T` or `Esc` stops.","**Zones carry what is in them.** Drag a zone and the devices, notes and smaller zones inside it move with it, cable bends included, so a whole rack or position moves in one go. Select a zone to see what it will take along. Hold `Alt` while dragging to move just the zone, to fit it around the kit again. One `Ctrl+Z` puts it all back.","**Switch ports pick up the VLAN of what you plug in.** If a device port already has a VLAN (from its symbol, or set in the device editor), cabling it to an empty switch port sets that switch port to the same VLAN, ready for the switch config and the patch sheet. A switch port that already has a VLAN, or is a trunk, is never changed: you get a warning if the two disagree. Works with **Link\u2026** too, and one `Ctrl+Z` undoes the cable and the VLAN. Turn it off in Settings if you would rather set switch ports by hand.","**Fill switch ports.** For cables drawn before that, the VLAN registry has a **Fill switch ports** button. It does the same for every cable already on the drawing, in one step you can undo. It shows how many ports it will set, and lists any that disagree with their device without changing them.","**Moving a cable end counts too.** Dragging a cable end onto a different, empty switch port gives that port the device\u2019s VLAN."]}]});var O0=Cr(mt=>{"use strict";K();var ml=Symbol.for("react.element"),n2=Symbol.for("react.portal"),o2=Symbol.for("react.fragment"),r2=Symbol.for("react.strict_mode"),a2=Symbol.for("react.profiler"),i2=Symbol.for("react.provider"),s2=Symbol.for("react.context"),l2=Symbol.for("react.forward_ref"),u2=Symbol.for("rea
