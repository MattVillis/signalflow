<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalFlow — AV Signal Schematic Editor</title>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div id="root"></div>
<script>
// Outside claude.ai the Anthropic API needs your own key. Asked once, kept in this
// browser's localStorage only. Delete with: localStorage.removeItem("sf_api_key")
// Feedback endpoint: paste a Formspree / Tally / Apps Script URL here and the
// in-app feedback form posts JSON to it. Left empty it offers a GitHub issue.
window.SF_FEEDBACK_URL = "";
(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
      var key = localStorage.getItem("sf_api_key");
      if (!key) {
        key = window.prompt("Anthropic API key for the AI symbol analyzer (sk-ant-...):\nStored only in this browser. Cancel to skip — everything else works without it.");
        if (key) localStorage.setItem("sf_api_key", key.trim());
      }
      if (key) {
        opts = opts || {};
        var h = opts.headers || {};
        h["x-api-key"] = key.trim();
        h["anthropic-version"] = "2023-06-01";
        h["anthropic-dangerous-direct-browser-access"] = "true";
        opts.headers = h;
      }
    }
    return orig(url, opts);
  };
})();
</script>
<script>(()=>{var Dx=Object.create;var zc=Object.defineProperty;var Ex=Object.getOwnPropertyDescriptor;var Tx=Object.getOwnPropertyNames;var Rx=Object.getPrototypeOf,Px=Object.prototype.hasOwnProperty;var Ax=(e,t)=>()=>(e&&(t=e(e=0)),t);var Ha=(e,t)=>()=>(t||e((t={exports:{}}).exports,t),t.exports);var Ox=(e,t,a,n)=>{if(t&&typeof t=="object"||typeof t=="function")for(let r of Tx(t))!Px.call(e,r)&&r!==a&&zc(e,r,{get:()=>t[r],enumerable:!(n=Ex(t,r))||n.enumerable});return e};var io=(e,t,a)=>(a=e!=null?Dx(Rx(e)):{},Ox(t||!e||!e.__esModule?zc(a,"default",{value:e,enumerable:!0}):a,e));var ce,J=Ax(()=>{ce=[{date:"2026-10-02",items:["**SignalFlow 1.0 \u2014 out of beta.** This is the first full release. From here on releases carry plain version numbers: a patch (1.0.1) fixes bugs, a minor version (1.1) adds features, and a major version (2.0) would only come with a change to the project file format. Settings and the logo tooltip show the version you are running next to the build stamp; quote it in bug reports.","**Links that open straight onto a screen.** Add `?show=vlan`, `?show=lists:switches`, `?show=export`, `?show=ai` or `?show=settings` to the app's address and it opens there; `?focus=network,video` starts in a ghost view and `?q=videohub` pre-fills the library search. Handy for pointing a colleague at exactly the thing you mean.","**An example project to explore.** `?open=examples/avoip-stage.signalflow.json` loads an AV-over-IP stage: encoders and decoders on a switch with CONTROL, AV and DANTE VLANs, IPs already assigned and a full switch patch sheet. A tab opened from one of these links does not auto-save, so it never replaces the session you left last time. Use `Save` if you want to keep your changes."]},{date:"2026-09-30",items:["**A tidy-up pass on the small stuff.** The collapse chip in a symbol header now sits on the header's centre line instead of hugging the top border, and the edited dot mirrors it on the right. In the Export menu the SIGNAL and PAGE rows line up, and a wrapped second row of signals sits under the first chip rather than under the label. Settings checkboxes are the app's own teal instead of browser blue. The sidebar's `New symbol` button is centred like the AI builder above it. In the device editor the IP row lines up with the port name above it. The legend's hop buttons no longer change size when you pick one, and the equipment list shows categories in caps like every other column."]},{date:"2026-09-29",items:["**Power connects whatever the two ends are, and the cable list says which lead.** A C13 outlet into a C14 inlet, a distro into a TRUE1 server, a DC brick \u2014 none of it is refused any more, because the lead always exists. What matters is which one, so the NOTE column specs it: `IEC C13-C14 JUMPER`, `IEC C13 TO TRUE1 LEAD`, `PSU / ADAPTER \xB7 IEC C13 TO DC`. Direction still applies \u2014 two inlets cannot feed each other \u2014 and Link\u2026 now treats every power port as one group, so a rack of mixed connectors cables in one go.","**Link\u2026 can cable power.** Select a distro and the gear it feeds, and the connector list now offers `IEC MAINS`, wiring each free outlet to the next free inlet. It never appeared before because a distro outlet is IEC C13 and a device inlet is C14: two unrelated connectors as far as the planner was concerned, so neither had both an output and an input to pair. Cables whose ends differ are now grouped by family, which also fixes RJ45 to etherCON, USB A-to-B and mixing 12G with 3G SDI in the same run.","**Ctrl+Alt shortcuts no longer double up.** `Ctrl+Alt+V` was toggling the video ghost *and* pasting the clipboard; the same overlap hit `Ctrl+Alt+F` (fit), `Ctrl+Alt+N` (note tool), `Ctrl+Alt+C` (collapse) and `Ctrl+Alt+A` (select all). The ghost mnemonics are now their own thing, and the ordinary Ctrl and bare-key shortcuts ignore anything held with Alt.","**Ghosted kit is properly out of the way.** Dragging a marquee, or Ctrl+A, no longer picks up equipment the ghost filter has faded. If you cannot see it you cannot select it, so it cannot be moved or deleted by accident either.","**USB never blocks on direction.** A USB socket is a socket: two ports that both read IN will still take a lead between them. The arrows stay on the drawing where they mean something \u2014 which way video or power flows on a USB-C port, or NovaStar cascade order \u2014 they just no longer stop you cabling. While checking that: NovaStar cascade **USB IN is a Type-B socket and USB OUT is Type-A**, per the VX1000 spec, so the VX1000, VX600 and MCTRL4K now say so.","**USB cables just work.** USB-A, USB-B and USB-C now connect to each other \u2014 an A-to-B or A-to-C lead is an ordinary cable, not a converter, and the app was wrongly asking for one. **USB-B** is a connector type in its own right now, so the ports that really are type B \u2014 the Taurus UCX host ports, the VINX service port \u2014 are drawn and listed as USB-B, and the cable list names both ends so the right lead gets ordered. USB-C into an HDMI or DisplayPort input is allowed too, flagged as needing that cable. Thanks to the beta user who reported it."]},{date:"2026-09-28",items:["**What's new, in the app.** This panel. The status bar carries a dot until the newest entry has been read, and the full history is a page on the site.","**Ghost sheets.** `Alt+1` \u2026 `Alt+6` \u2014 or `Ctrl+Alt+V/F/N/A/C/P` \u2014 fades everything that is not carrying that signal, so a busy sheet becomes just the network, or just the video. They stack, `Esc` clears, and alt-clicking a legend row does the same. A chip top-left names the filter.","**It follows the signal through the kit.** A fibre run is never a service of its own, so it carries whatever the box at its end terminates: focusing VIDEO keeps the fibre between a TX and an RX, focusing NETWORK keeps a fibre trunk carrying the LAN. An RJ45 is read off its port name \u2014 AV, TPS, TPX, SDVoE and NDI ports are an AV stream, DANTE is audio, plain LAN stays the network \u2014 so an AV-over-IP chain shows encoder, switch and decoder without the rest of the LAN lighting up. PoE counts as power.","**Export and save by signal.** The Export menu has a SIGNAL row: tick what you want and it drives the SVG, the Print/PDF and a new **project copy** holding only those cables and the equipment they touch. A normal Save now remembers the view you were in, without removing anything from the file.","**Lightware, in full** \u2014 52 symbols. MX2 matrices including the audio and redundant frames and the DH DisplayPort hybrids, Taurus UCX across its generations, MMX multiport switchers, TPS / TPX / OPTX extenders, VINX, Gemini GVN and UBEX. Ports come from Lightware's own per-model port diagrams.","**openGear frames.** Ross OGX-FR and AJA OG-X-FR with an 18-card catalogue from AJA, Cobalt Digital and Ross. Cards are listed as card + rear-module pairings, because in openGear the rear module is what decides the connectors.","**Power everywhere.** Every symbol that takes mains now has an inlet, DC and 4-pin XLR are proper connector types, and the demo sheet ships with a 12-way distro cabled to everything. One fix worth naming: the disguise EX 3 was drawn with dual IEC \u2014 the whole VX/GX/EX range is a single powerCON TRUE1."]},{date:"2026-09-25",items:["**VLAN subnets and automatic IPs.** Give a VLAN a subnet and, with the setting on, anything you patch to it gets the next free address \u2014 shown under the symbol name, or under the port itself when a box has several LAN connections. Switches are skipped, and the VLAN is taken from either end of the cable.",'**Your VLAN scheme persists.** "Save as defaults" keeps your numbering for every new project, and it travels inside the library file between machines.',"**Switch patch sheet.** A third call list: every network port on every switch, its VLAN, what it connects to and the cable number. Spare ports are listed too, so it doubles as a free-capacity check.","**KVM category** with the ADDERLink XDIP and Matrox Avio 2, transmitter and receiver each.","Tidier library footer \u2014 the file actions became icons and the Repo button now carries its own sync status."]},{date:"2026-09-24",items:["**Collapse a symbol** to only the ports it is patched into \u2014 the `[\u2212]` in the header, or `C` on a selection. Handy on a 48-port frame with six cables in it.",'**Slot presets** for modular symbols: save "VX 4+ with HDMI VFCs", star it as the default for new placements, and it travels in the library file.',"**Client logo in the title block**, with a small designer for its position, size and alignment. It reaches SVG and PDF as well as the screen.","**Pixelhue and Analog Way packs**, plus the Videohub 120x120 12G and the modular Universal Videohub 288.","Port limits lifted when building a symbol \u2014 a 288-port chassis is fine now.","Toolbar tidy; copy/paste/duplicate are keyboard only, and `Ctrl+S` saves."]},{date:"2026-09-23",items:["**Feedback form** in the status bar: bug, idea, missing symbol, with an optional diagnostics line. It never includes your drawing."]},{date:"2026-09-22",items:["**LED processing**: Brompton Tessera, Megapixel HELIOS and the NovaStar range, including the modular H-series.","**PIXERA, LightAct and Blackmagic Design** packs \u2014 cameras in their own category, the 2110 IP range and the rest of Videohub.","**Auto-save** to this browser, with a Restore card if the tab dies. Nothing leaves the machine.","**Ctrl+F** finds devices, ports and IPs across every sheet; **page frames** give a true A4/A3/A2 print and PDF, and the Export menu gathers page size, SVG and print in one place.","The library opens with categories folded, and two inputs or two outputs can no longer be cabled together."]}]});var tp=Ha(Ie=>{"use strict";J();var yr=Symbol.for("react.element"),bx=Symbol.for("react.portal"),Nx=Symbol.for("react.fragment"),Ux=Symbol.for("react.strict_mode"),Bx=Symbol.for("react.profiler"),Hx=Symbol.for("react.provide
