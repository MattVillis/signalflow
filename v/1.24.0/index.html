<title>SignalFlow — AV Signal Schematic Editor</title>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden;font-family:ui-monospace,monospace}</style>

<body>
<div id="root"></div>
<script>
// Outside claude.ai the Anthropic API needs your own key. Asked once, kept in this
// browser's localStorage only. Delete with: localStorage.removeItem("sf_api_key")
// Feedback endpoint: paste a Formspree / Tally / Apps Script URL here and the
// in-app feedback form posts JSON to it. Left empty it offers a GitHub issue.
window.SF_FEEDBACK_URL = "";
(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
      var key = localStorage.getItem("sf_api_key");
      if (!key) {
        key = window.prompt("Anthropic API key for the AI symbol analyzer (sk-ant-...):\nStored only in this browser. Cancel to skip — everything else works without it.");
        if (key) localStorage.setItem("sf_api_key", key.trim());
      }
      if (key) {
        opts = opts || {};
        var h = opts.headers || {};
        h["x-api-key"] = key.trim();
        h["anthropic-version"] = "2023-06-01";
        h["anthropic-dangerous-direct-browser-access"] = "true";
        opts.headers = h;
      }
    }
    return orig(url, opts);
  };
})();
</script>

large display** (three HDMI and a DisplayPort in, LAN and RS-232 control). Under Audio: a **generic active speaker** with one XLR input, for a Genelec-style powered monitor. For when the exact model does not matter.","**The whole NETGEAR M4250, M4350 and M4500 range.** All 13 M4250 (NETGEAR's AV Line), all 18 M4350 and both M4500 switches are in the library under Network, 33 in all, from NETGEAR's installation guides and datasheets. Every port is numbered as on the panel, PoE ports are marked PoE+ or PoE++ (so the Power view lights what they feed), and each has its management, console and USB ports and its real power inputs: the external 54V adapter on the desktop models, two or three PSUs where the switch has them, and the empty APS bays on the M4350.","**Switch config: right port names for each NETGEAR family.** NETGEAR's CLI reference says an M4250 on current firmware names its ports **0/1, 0/2\u2026**, not 1/0/1, so the change set now writes `interface 0/1` for an M4250 (including a shared-library M4250 symbol). The M4350 keeps 1/0/1. An M4500 gets its own syntax, since it has none of the `vlan participation` commands. The management address now uses `ip management vlan`, the command in the current reference. You can still override the naming per switch in the device editor.","**NETGEAR AV Line M4250-8G2XF-PoE+.** The 8-port PoE+ switch with two 10G SFP+ uplinks, under Network: eight PoE+ ports, SFP+ 9 and 10, the management and console ports and its 54V power input. **Lists > Switch config** numbers it the way NETGEAR does, 1/0/1 to 1/0/10.","**Fixed: switch config numbered the management port.** The out-of-band management socket was given an interface number (1/0/11 on an 8-port switch, 1/0/31 on the M4250-26G4F). It is a separate service port on NETGEAR, so it is now left out of the port map and the change set.","**Computers.** A new library category for the PCs around a show: the **Minisforum MS-A2** and **MS-A1**, the **ASUS NUC 14 Pro** (what the Intel NUC became), and three generic ones, a **mini PC**, a **workstation with a 4-output graphics card** and a **laptop**, for when the exact model does not matter. USB-C and Thunderbolt ports that carry DisplayPort are drawn as video outputs, so a cable from one to a screen or a converter reads as video.","**Blackmagic Micro Converter BiDirectional SDI/HDMI, 12G and 3G.** SDI to HDMI and HDMI to SDI at the same time, each with SDI in and out, HDMI in and out and USB-C power, from Blackmagic's tech specs. Under Control with the other Blackmagic converters."]},{date:"2026-10-10",items:["**Fixed: a Restore offer for a drawing you never touched.** Opening SignalFlow, changing nothing and coming back later asked whether to restore the previous session. It now only offers that once you have actually drawn something.","**Live sessions: draw together.** Click **SESSION** in the toolbar, put in your name and **Start a session**, then send the link. Everyone who opens it edits the same drawing at the same time, on the same sheet or on different ones. You see each other's cursors and what each person has selected, in their own colour, and the toolbar shows who is in. `Ctrl+Z` only takes back your own changes, never someone else's. If the connection drops you keep drawing, and your changes go through when it comes back. Nothing to install: it runs on SignalFlow's session server, and a session is kept for 30 days after the last edit. **Leave session** keeps the drawing open on your screen; save a file as well if you want your own copy."]},{date:"2026-10-09",items:["**Trace a signal end to end.** Select a cable (or a whole device) and press `T`, or **Trace** in the toolbar, and its path lights up while everything else fades: back to the source, forward to every destination, through converters, fibre and AV-over-IP, and onto other sheets (the chip at the top left has a button for each sheet the path continues on). Through a switch it follows the stream, so a decoder traces back to the encoders and not to the Dante node on the next port, while a plain LAN or control cable stops at the switch rather than lighting up the whole network. `T` or `Esc` stops.","**Zones carry what is in them.** Drag a zone and the devices, notes and smaller zones inside it move with it, cable bends included, so a whole rack or position moves in one go. Select a zone to see what it will take along. Hold `Alt` while dragging to move just the zone, to fit it around the kit again. One `Ctrl+Z` puts it all back.","**Switch ports pick up the VLAN of what you plug in.** If a device port already has a VLAN (from its symbol, or set in the device editor), cabling it to an empty switch port sets that switch port to the same VLAN, ready for the switch config and the patch sheet. A switch port that already has a VLAN, or is a trunk, is never changed: you get a warning if the two disagree. Works with **Link\u2026** too, and one `Ctrl+Z` undoes the cable and the VLAN. Turn it off in Settings if you would rather set switch ports by hand.","**Fill switch ports.** For cables drawn before that, the VLAN registry has a **Fill switch ports** button. It does the same for every cable already on the drawing, in one step you can undo. It shows how many ports it will set, and lists any that disagree with their device without changing them.","**Moving a cable end counts too.** Dragging a cable end onto a different, empty switch port gives that port the device\u2019s VLAN."]},{date:"2026-10-08",items:["**VLAN lists in and out.** The VLAN registry has **Import\u2026**, **Export** and **CSV**. Hand a house VLAN plan to another crew as a file, or bring one in from the network person's spreadsheet: VLAN, NAME, SUBNET, FROM, COLOUR, with or without a header row. Import only adds: a VLAN number you already have is left exactly as it is.","**Back to the library version.** A device whose ports you edited by hand has a **\u21BA Library version** button in its editor. It puts the ports and width back to the library symbol and keeps the VLAN, trunk, LAG and IP settings on its ports. It warns you if a port only that device had (and any cable on it) will go.","**Replace several devices at once.** Select them all (eight encoders, say) and press `R` or **Replace\u2026**. Every device is worked out on its own and the list ranks symbols by how many cables they keep across the lot. A table shows any device that would lose a cable or a VLAN setting. One `Ctrl+Z` undoes the whole swap.","**New VLANs get their own colours.** VLANs numbered 10, 20, 30\u2026 all came out the same blue. Each VLAN you add now takes a colour no other VLAN is using. If an existing project already has several on one colour, the registry offers a button to give each its own.","**Numbered ports can start anywhere.** Add multiple has a **from** box: set 25 to add PORT 25\u201326 for the 1G pair on a 24+2 switch. Leave it blank to carry on from the last number as before.","**Cable numbers stay put.** A cable keeps its number for good, so labels you have already printed stay right: a new cable takes the next free number instead of shifting everything after it, and deleting one leaves a gap rather than renumbering the rest. Older projects are numbered on open exactly as their lists printed before. Breakout legs still share their DAC's number. **Renumber\u2026** in Lists \u2192 Cables starts again from C001 when you want a clean set. A selected cable shows its number, and `Ctrl+F` finds a cable by the label in your hand (`C13`, `C013-2`).","**Only the left button moves things.** Middle-drag now pans the sheet even when it starts on a symbol, and a right-click no longer drags a symbol, note or cable end around.","**40G breakouts into SFP28 ports.** A QSFP+ 4\xD7 10G breakout DAC can now land its tails in SFP28 ports as well as SFP+ ones \u2014 even a mix on the same cable. Those legs carry the note *SFP+ leg in SFP28 port \xB7 runs at 10G*.","**QSFP+ into a QSFP28 port is allowed.** A 100G QSFP28 port takes a 40G QSFP+ module, so that cable now links with the note *QSFP+ module in QSFP28 port \xB7 runs at 40G*, the same way SFP+ into SFP28 does.","**Shortcuts work on every keyboard layout.** On Russian, Greek, Hebrew and other non-Latin layouts the letter shortcuts did nothing \u2014 `Ctrl+Z` and `Ctrl+S` included \u2014 and now work from the same keys. On French (AZERTY) keyboards the number shortcuts work without Shift: hold `1` / `2` / `3` while clicking a port, and `0` to reset the zoom. Letter shortcuts still follow the letter printed on your key, so `Ctrl+Z` is the key labelled Z, as in every other app.","**Replacing a switch keeps the VLANs on unpatched ports too.** Ports you had set up with a VLAN, trunk, LAG or IP before anything was plugged in now move to the new switch as well \u2014 same port name where it exists, otherwise the next free port. They are listed in the Replace table under the cables, can be moved by hand, and if the new switch has no room for some of them the window says so before you commit.",'**Pressing `R` no longer types an "r" into the Replace search.** The window opens with an empty search box, ready to type.',"**SFP+ into an SFP28 port is allowed.** A 25G SFP28 port takes a 10G SFP+ module, so that cable now links instead of being refused, with the note *SFP+ module in SFP28 port \xB7 runs at 10G* in the popover and the cable list.","**Replace a symbol and keep its cables.** Select a device and press `R` (or **Replace\u2026** in the toolbar, or in the device editor) to swap it for a different symbol \u2014 a 48-port switch for a 16-port one, a Videohub 40x40 for a 20x20. Each cable moves to a matching port on the new symbol: same name first, then the same kind of port in order, so cables on ports 40 and 41 land on the next free ports rather than anywhere. The list shows up front whether each symbol **fits all** your cables, fits only with adapters, or **drops** some, and a table shows where every cable will go \u2014 change any of them by hand. If a cable has nowhere to go, it says so in red before you commit, and `Ctrl+Z` brings everything back. The device keeps its name and IP, and each port's VLAN, trunk and LAG settings move with its cable.","**Choose where your project is saved.** **Save** now asks where to put the file and what to call it, instead of dropping it in Downloads. After that the project remembers its file: the next **Save** (`Ctrl+S`) asks whether to **overwrite** it or **save as a new file** \u2014 press `Enter` to overwrite. **Save as** (`Ctrl+Shift+S`) always asks for a new location. Opening a project links it to that file too, and the status bar shows which file you are working on. Works in Chrome and Edge; Firefox and Safari still download a copy, as before.","**Windows no longer close when a drag ends outside them.** Selecting text in a field and letting go past the edge of the window used to count as a click on the background, closing it and losing whatever you had typed. A window now closes only on a real click outside it, or its close button."]},{date:"2026-10-05",items:["**Big cable bundles no longer freeze the sheet.** A drawing with a large run of cables between two columns (70+ off a router into a row of servers) could lock the page for many seconds on every move, drag or edit while the cable spacing was worked out again from scratch. The spacing is now worked out much faster, remembered for the parts of the sheet you did not touch, and held still while you drag, then settled once you let go. The cables are drawn in exactly the same places as before.","**Fibre ports take VLANs too.** An SFP or fibre port now has the same VLAN, ACCESS / TRUNK, tagged-VLAN, LAG and IP fields as a copper network port, so a switch's fibre uplinks and a server's SFP NIC can be set up properly. A fibre cable on an access VLAN is drawn in that VLAN's colour and stays solid, so you can still tell it from copper. It also counts in the VLAN registry, the cable list, auto-IP and the switch config output.","**Switch change sets for NETGEAR M4250 / GSM.** Lists gained a **SWITCH CONFIG** tab: pick a switch and it writes the commands for the things the drawing is actually sure about \u2014 VLANs and their names, port PVIDs, trunk tagging, LAG membership and the management address \u2014 ready to review and paste. Two syntaxes: NETGEAR's classic `vlan participation` / `vlan pvid` / `vlan tagging`, or the shorter `switchport` form. Copy it, or download one `.txt` per switch.","**It is a change set, not a config.** It never writes spanning tree, QoS, IGMP snooping, PoE or anything else it cannot read off the sheet, and it deletes nothing \u2014 the one removal, taking access ports out of VLAN 1, is a tick-box that is off until you ask. It never saves on the switch either: apply, verify, then `write memory` yourself, so a reboot undoes a mistake.","**It prints the port map first.** Every interface it is about to touch, with the port label it came from and what it will do \u2014 because an off-by-one between `PORT 1` and `1/0/1` is an outage, and that is the one thing worth checking by eye. If a switch numbers its ports differently, give it a pattern in the device editor (`1/0/{n}`, `xe-0/0/{n}`) and everything follows.","**It warns you about the cable you are sitting on.** If the switch has a management address, the change set names the port carrying that VLAN and tells you to do that one from the console \u2014 re-PVIDing it from a session that runs through it cuts you off mid-paste.","**Leader LT4670 sync generator, with its option modules.** The chassis carries the genlock loop, six analog black outputs, CW/1PPS, word clock, silence, AES/EBU, LTC/remote, L-SYNC and the ethernet port; the five hardware options are slots you fill in the device editor \u2014 `SER01` GNSS, `SER02` 3G-SDI (two can be fitted, so there are two positions), `SER03` PTP SFPs, `SER04` 25G-IP plus 12G-SDI, and `SER11` redundant power. It is placed with the GNSS and the first SDI pair fitted; add the rest from MODULES. `SER02` and `SER04` cannot be fitted together in the real instrument, which the card names say \u2014 the drawing cannot stop you.","**Three connectors the catalogue was missing**: `HD-BNC` (micro-BNC, on 12G gear), `DIN 1.0/2.3` (word clock and AES/EBU on sync panels) and `D-SUB 15` / `D-SUB 26`. The miniature 1.0/2.3 series is not a BNC, so patching one to a full-size BNC is allowed and the cable list asks for the adapter lead.","**Slot headers stop printing through each other.** On a chassis with an input card down one side and an output card down the other, the two slot headings landed on the same line and overlapped. Each now takes its own row."]},{date:"2026-10-04",items:["**The whole Dante AVIO range.** All eight Audinate adapters are in the library under Audio: analog in 1 and 2 channel, analog out 1 and 2 channel, the AES3 2x2, the USB and USB-C adapters, and the Bluetooth 2x1. Connector genders are on the ports where you need them \u2014 `IN 1 XLR-F`, `OUT 2 XLR-M` \u2014 because that is what decides which cable you pack. None of them has a mains inlet, which is right: every AVIO runs on PoE from the switch, and the Dante port says so, so an `Alt+6` power view lights the adapters fed over their network cable.","**An SFP cage can be patched with copper.** A cage is a hole \u2014 what comes out of it is whatever module you put in \u2014 so an `SFP+` or `SFP` port now links to an `RJ45 10G`, `RJ45` or `etherCON` port instead of being refused. It was asked for on the **Matrox Avio 2** TX and RX, whose two media cages take 1GbE or 10GbE fibre or copper, and it applies to every cage in the library. The link names the module it needs \u2014 `NEEDS 10GBASE-T SFP+ MODULE + CAT6A` \u2014 in the popover and in the cable list, so it gets ordered, and because the cable in your hand is Cat6a the run draws, filters and legends as **network** rather than fibre.","**The legend and the title block fold away.** Both sit in the corners of the window rather than on the paper, so on a laptop they covered the drawing. Each has a `\u25BE` now and folds to a small chip you click to bring it back; the choice is remembered. Both are still drawn on every export, folded or not.","**`Esc` closes one thing at a time.** It used to clear everything at once \u2014 a stray `Esc` aimed at a menu also dropped the ghost view you were working in and your selection. It now closes the topmost thing: dialog, then popover, then the tool or half-drawn cable, then the ghost filter, then the selection. Opening a dialog also closes whatever popover was open, instead of stacking on top of it.","**Keyboard shortcuts are grouped.** The `?` panel is now Draw / Link / Edit / View / Ghost sheets / File instead of one long list, and it fits a laptop screen \u2014 as does the toolbar, which wraps rather than running off the edge.","**Print / PDF is no longer greyed out.** It picks A3 for you if you have not chosen a paper size, and says so, rather than sitting there looking broken.","**The AI builder asks two clear questions.** *What you have* \u2014 a rear-panel drawing, or a model number. *Who does the work* \u2014 the local bridge, the Claude API, or any agent you already use. The help text and the fields now follow the engine you picked, instead of describing one while another was selected.","**Labels on the things that had none.** Column headings (gap, label, side, direction, signal, connector) over every port editor; a `WIDTH` label on the width box; `LIB` on the two library file buttons in the sidebar, which read as Save and Open; `synced 14:44` instead of `\u2713 14:44`; distinct icons for bring to front and send to back, which looked like import and export; and tooltips that say why a button is greyed out instead of nothing at all.","**Fibre, not fiber.** The legend now matches the rest of the app's spelling.","**Switch ports can be trunks, carry several VLANs, and join a LAG.** The VLAN row in the device editor gained an `ACCESS` / `TRUNK` button, a `LAG` box and \u2014 on a trunk \u2014 a row of VLAN chips for everything it carries tagged. The single VLAN dropdown becomes the native VLAN once a port is a trunk.","**The drawing says so.** A trunk or LAG port carries a small line under its label \u2014 `TRUNK 10,20 \xB7 LAG UP1` \u2014 beside the address line. A trunk is no longer coloured as though it were one VLAN: the port text and its cable stay plain network, because a trunk is not a single service.","**Patch sheet and cable list follow.** SWITCH PORTS gained `MODE` (ACCESS / TRUNK) and `LAG` columns, and its VLAN cell now reads the whole story \u2014 `10`, `TRUNK 20,30`, or `1 + TAG 10,20`. The cable list names the trunk and notes LAG membership. Both reach CSV and the printable sheet.","**The VLAN registry shows what each VLAN is doing.** Every row now carries a use count \u2014 `2A 4T`, two untagged ports and four tagged on a trunk \u2014 so you can see what a VLAN is carrying, and what deleting it would strand. Hover for the detail.","**Flags always name the port.** An off-page or same-sheet flag used to be cut at 24 characters, which on a long device name ate the port entirely \u2014 the one thing the flag exists to tell you. The port is now reserved first and the device name shortened to fit, model end first, so `LIGHTWARE MX2-48x48-DH-48DPio-A-R` reads `MX2-48x48-DH-48\u2026 \xB7 DP IN 1` and `DISGUISE VX 4+` reads `VX 4+ \xB7 ETH D 100G`. Hover any flag for the full name, sheet and port.","**Breakout DACs.** A 100G QSFP28 port can now be cabled to up to four 25G (SFP28) or 10G (SFP+) ports, and a 40G QSFP+ to four 10G \u2014 the one place the drawing allows more than one cable on a port, because it really is one cable. Click the trunk once and it stays armed: each following port click lands the next lane, and the toast counts you through `lane 2 of 4`. A fifth is refused.","**One DAC, not four patch leads.** Each leg is tagged `DAC 2/4` on the sheet where it lands, and in the cable l
