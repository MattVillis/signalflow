<title>SignalFlow — AV Signal Schematic Editor</title>
<style>html,body,#root{height:100%;margin:0}body{overflow:hidden;font-family:ui-monospace,monospace}</style>

<body>
<div id="root"></div>
<script>
// Outside claude.ai the Anthropic API needs your own key. Asked once, kept in this
// browser's localStorage only. Delete with: localStorage.removeItem("sf_api_key")
// Feedback endpoint: paste a Formspree / Tally / Apps Script URL here and the
// in-app feedback form posts JSON to it. Left empty it offers a GitHub issue.
window.SF_FEEDBACK_URL = "";
(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf("api.anthropic.com") !== -1) {
      var key = localStorage.getItem("sf_api_key");
      if (!key) {
        key = window.prompt("Anthropic API key for the AI symbol analyzer (sk-ant-...):\nStored only in this browser. Cancel to skip — everything else works without it.");
        if (key) localStorage.setItem("sf_api_key", key.trim());
      }
      if (key) {
        opts = opts || {};
        var h = opts.headers || {};
        h["x-api-key"] = key.trim();
        h["anthropic-version"] = "2023-06-01";
        h["anthropic-dangerous-direct-browser-access"] = "true";
        opts.headers = h;
      }
    }
    return orig(url, opts);
  };
})();
</script>

he next **Save** (`Ctrl+S`) asks whether to **overwrite** it or **save as a new file** \u2014 press `Enter` to overwrite. **Save as** (`Ctrl+Shift+S`) always asks for a new location. Opening a project links it to that file too, and the status bar shows which file you are working on. Works in Chrome and Edge; Firefox and Safari still download a copy, as before.","**Windows no longer close when a drag ends outside them.** Selecting text in a field and letting go past the edge of the window used to count as a click on the background, closing it and losing whatever you had typed. A window now closes only on a real click outside it, or its close button."]},{date:"2026-10-05",items:["**Big cable bundles no longer freeze the sheet.** A drawing with a large run of cables between two columns (70+ off a router into a row of servers) could lock the page for many seconds on every move, drag or edit while the cable spacing was worked out again from scratch. The spacing is now worked out much faster, remembered for the parts of the sheet you did not touch, and held still while you drag, then settled once you let go. The cables are drawn in exactly the same places as before.","**Fibre ports take VLANs too.** An SFP or fibre port now has the same VLAN, ACCESS / TRUNK, tagged-VLAN, LAG and IP fields as a copper network port, so a switch's fibre uplinks and a server's SFP NIC can be set up properly. A fibre cable on an access VLAN is drawn in that VLAN's colour and stays solid, so you can still tell it from copper. It also counts in the VLAN registry, the cable list, auto-IP and the switch config output.","**Switch change sets for NETGEAR M4250 / GSM.** Lists gained a **SWITCH CONFIG** tab: pick a switch and it writes the commands for the things the drawing is actually sure about \u2014 VLANs and their names, port PVIDs, trunk tagging, LAG membership and the management address \u2014 ready to review and paste. Two syntaxes: NETGEAR's classic `vlan participation` / `vlan pvid` / `vlan tagging`, or the shorter `switchport` form. Copy it, or download one `.txt` per switch.","**It is a change set, not a config.** It never writes spanning tree, QoS, IGMP snooping, PoE or anything else it cannot read off the sheet, and it deletes nothing \u2014 the one removal, taking access ports out of VLAN 1, is a tick-box that is off until you ask. It never saves on the switch either: apply, verify, then `write memory` yourself, so a reboot undoes a mistake.","**It prints the port map first.** Every interface it is about to touch, with the port label it came from and what it will do \u2014 because an off-by-one between `PORT 1` and `1/0/1` is an outage, and that is the one thing worth checking by eye. If a switch numbers its ports differently, give it a pattern in the device editor (`1/0/{n}`, `xe-0/0/{n}`) and everything follows.","**It warns you about the cable you are sitting on.** If the switch has a management address, the change set names the port carrying that VLAN and tells you to do that one from the console \u2014 re-PVIDing it from a session that runs through it cuts you off mid-paste.","**Leader LT4670 sync generator, with its option modules.** The chassis carries the genlock loop, six analog black outputs, CW/1PPS, word clock, silence, AES/EBU, LTC/remote, L-SYNC and the ethernet port; the five hardware options are slots you fill in the device editor \u2014 `SER01` GNSS, `SER02` 3G-SDI (two can be fitted, so there are two positions), `SER03` PTP SFPs, `SER04` 25G-IP plus 12G-SDI, and `SER11` redundant power. It is placed with the GNSS and the first SDI pair fitted; add the rest from MODULES. `SER02` and `SER04` cannot be fitted together in the real instrument, which the card names say \u2014 the drawing cannot stop you.","**Three connectors the catalogue was missing**: `HD-BNC` (micro-BNC, on 12G gear), `DIN 1.0/2.3` (word clock and AES/EBU on sync panels) and `D-SUB 15` / `D-SUB 26`. The miniature 1.0/2.3 series is not a BNC, so patching one to a full-size BNC is allowed and the cable list asks for the adapter lead.","**Slot headers stop printing through each other.** On a chassis with an input card down one side and an output card down the other, the two slot headings landed on the same line and overlapped. Each now takes its own row."]},{date:"2026-10-04",items:["**The whole Dante AVIO range.** All eight Audinate adapters are in the library under Audio: analog in 1 and 2 channel, analog out 1 and 2 channel, the AES3 2x2, the USB and USB-C adapters, and the Bluetooth 2x1. Connector genders are on the ports where you need them \u2014 `IN 1 XLR-F`, `OUT 2 XLR-M` \u2014 because that is what decides which cable you pack. None of them has a mains inlet, which is right: every AVIO runs on PoE from the switch, and the Dante port says so, so an `Alt+6` power view lights the adapters fed over their network cable.","**An SFP cage can be patched with copper.** A cage is a hole \u2014 what comes out of it is whatever module you put in \u2014 so an `SFP+` or `SFP` port now links to an `RJ45 10G`, `RJ45` or `etherCON` port instead of being refused. It was asked for on the **Matrox Avio 2** TX and RX, whose two media cages take 1GbE or 10GbE fibre or copper, and it applies to every cage in the library. The link names the module it needs \u2014 `NEEDS 10GBASE-T SFP+ MODULE + CAT6A` \u2014 in the popover and in the cable list, so it gets ordered, and because the cable in your hand is Cat6a the run draws, filters and legends as **network** rather than fibre.","**The legend and the title block fold away.** Both sit in the corners of the window rather than on the paper, so on a laptop they covered the drawing. Each has a `\u25BE` now and folds to a small chip you click to bring it back; the choice is remembered. Both are still drawn on every export, folded or not.","**`Esc` closes one thing at a time.** It used to clear everything at once \u2014 a stray `Esc` aimed at a menu also dropped the ghost view you were working in and your selection. It now closes the topmost thing: dialog, then popover, then the tool or half-drawn cable, then the ghost filter, then the selection. Opening a dialog also closes whatever popover was open, instead of stacking on top of it.","**Keyboard shortcuts are grouped.** The `?` panel is now Draw / Link / Edit / View / Ghost sheets / File instead of one long list, and it fits a laptop screen \u2014 as does the toolbar, which wraps rather than running off the edge.","**Print / PDF is no longer greyed out.** It picks A3 for you if you have not chosen a paper size, and says so, rather than sitting there looking broken.","**The AI builder asks two clear questions.** *What you have* \u2014 a rear-panel drawing, or a model number. *Who does the work* \u2014 the local bridge, the Claude API, or any agent you already use. The help text and the fields now follow the engine you picked, instead of describing one while another was selected.","**Labels on the things that had none.** Column headings (gap, label, side, direction, signal, connector) over every port editor; a `WIDTH` label on the width box; `LIB` on the two library file buttons in the sidebar, which read as Save and Open; `synced 14:44` instead of `\u2713 14:44`; distinct icons for bring to front and send to back, which looked like import and export; and tooltips that say why a button is greyed out instead of nothing at all.","**Fibre, not fiber.** The legend now matches the rest of the app's spelling.","**Switch ports can be trunks, carry several VLANs, and join a LAG.** The VLAN row in the device editor gained an `ACCESS` / `TRUNK` button, a `LAG` box and \u2014 on a trunk \u2014 a row of VLAN chips for everything it carries tagged. The single VLAN dropdown becomes the native VLAN once a port is a trunk.","**The drawing says so.** A trunk or LAG port carries a small line under its label \u2014 `TRUNK 10,20 \xB7 LAG UP1` \u2014 beside the address line. A trunk is no longer coloured as though it were one VLAN: the port text and its cable stay plain network, because a trunk is not a single service.","**Patch sheet and cable list follow.** SWITCH PORTS gained `MODE` (ACCESS / TRUNK) and `LAG` columns, and its VLAN cell now reads the whole story \u2014 `10`, `TRUNK 20,30`, or `1 + TAG 10,20`. The cable list names the trunk and notes LAG membership. Both reach CSV and the printable sheet.","**The VLAN registry shows what each VLAN is doing.** Every row now carries a use count \u2014 `2A 4T`, two untagged ports and four tagged on a trunk \u2014 so you can see what a VLAN is carrying, and what deleting it would strand. Hover for the detail.","**Flags always name the port.** An off-page or same-sheet flag used to be cut at 24 characters, which on a long device name ate the port entirely \u2014 the one thing the flag exists to tell you. The port is now reserved first and the device name shortened to fit, model end first, so `LIGHTWARE MX2-48x48-DH-48DPio-A-R` reads `MX2-48x48-DH-48\u2026 \xB7 DP IN 1` and `DISGUISE VX 4+` reads `VX 4+ \xB7 ETH D 100G`. Hover any flag for the full name, sheet and port.","**Breakout DACs.** A 100G QSFP28 port can now be cabled to up to four 25G (SFP28) or 10G (SFP+) ports, and a 40G QSFP+ to four 10G \u2014 the one place the drawing allows more than one cable on a port, because it really is one cable. Click the trunk once and it stays armed: each following port click lands the next lane, and the toast counts you through `lane 2 of 4`. A fifth is refused.","**One DAC, not four patch leads.** Each leg is tagged `DAC 2/4` on the sheet where it lands, and in the cable list the legs share one number with a lane suffix \u2014 `C012-1` \u2026 `C012-4` \u2014 and name the assembly, so the order is for one breakout cable. The switch patch sheet gives a trunk port a row per lane.","**A port you just cabled is clickable again.** Clicking the end dot of a selected cable used to do nothing, which made the port look dead the moment a cable landed on it. A click with no drag now goes through to the port; dragging still re-patches the end.","Auto-IP skips trunk ports. A trunk carries many subnets, so it is no basis for handing the device at the far end an address."]},{date:"2026-10-02",items:["**Earlier versions stay up.** Every release now lives at its own address, listed at [versions](https://mattvillis.github.io/signalflow/versions.html) and linked from What's new. If a new version misbehaves, open the one before it and carry on \u2014 your projects are files on your machine and open in any version. Each release also carries a downloadable standalone on GitHub.","**Link\u2026 can target exact ports.** Each device in the Link\u2026 dialog now has an `All ports` button: open it and tick precisely which ports take part. They pair in the order shown, so ticking OUT 5-8 on the source and IN 1-4 on the destination wires 5\u21921, 6\u21922, 7\u21923, 8\u21924 in one go. Leave it alone and nothing changes \u2014 every matching port is used, exactly as before.","**Fixed:** moving the print box reset the size you had dragged it to, so it jumped back to one sheet at 100%. It now keeps its size wherever you put it.","**Drag the print box to choose what goes on the paper.** Pick a page size and the dashed frame on the sheet grows corner handles: drag it around whatever you want printed and the frame tab tells you the scale as you go (`A4 \xB7 297 \xD7 210 \xB7 70%`). The paper never changes size \u2014 the drawing is fitted to it \u2014 so a whole stage goes on one A3 and a single rack goes on A4 at full size. `FIT BOX` in the Export menu sizes the frame around everything in one click. The legend and title block keep their printed size however far you zoom out, so they stay legible.","**Link\u2026 can target exact ports.** Each device in the Link\u2026 dialog now has an `All ports` button: open it and tick precisely which ports take part. They pair in the order shown, so ticking OUT 5-8 on the source and IN 1-4 on the destination wires 5\u21921, 6\u21922, 7\u21923, 8\u21924 in one go. Leave it alone and nothing changes \u2014 every matching port is used, exactly as before.",'**Scale to fit the paper.** Pick a page size in the Export menu and there is now a `FIT` toggle beside it: the drawing is scaled to fit the sheet while the paper stays exactly the size you chose, so a big stage still prints on one A3. The menu tells you what it will do ("scaled to fit \u2014 51% on A4") before you commit, and the legend and title block keep their own size so they stay legible at any scale. Applies to the SVG, Print and PDF alike.',"**One hop over a whole bundle.** With ARC crossings selected, a run that crosses several cables close together now leaves the line once, arcs over the lot and lands the other side, instead of a row of little bumps. A lone crossing is unchanged. Wide bundles give a long shallow arc rather than a balloon, and GAP behaves the same way \u2014 one break, not several.","**SignalFlow 1.0 \u2014 out of beta.** This is the first full release. From here on releases carry plain version numbers: a patch (1.0.1) fixes bugs, a minor version (1.1) adds features, and a major version (2.0) would only come with a change to the project file format. Settings and the logo tooltip show the version you are running next to the build stamp; quote it in bug reports.","**Links that open straight onto a screen.** Add `?show=vlan`, `?show=lists:switches`, `?show=export`, `?show=ai:research` or `?show=settings` to the app's address and it opens there; `?focus=network,video` starts in a ghost view and `?q=videohub` pre-fills the library search. Handy for pointing a colleague at exactly the thing you mean.","**An example project to explore.** `?open=examples/avoip-stage.signalflow.json` loads an AV-over-IP stage: encoders and decoders on a switch with CONTROL, AV and DANTE VLANs, IPs already assigned and a full switch patch sheet. A tab opened from one of these links does not auto-save, so it never replaces the session you left last time. Use `Save` if you want to keep your changes."]},{date:"2026-09-30",items:["**A tidy-up pass on the small stuff.** The collapse chip in a symbol header now sits on the header's centre line instead of hugging the top border, and the edited dot mirrors it on the right. In the Export menu the SIGNAL and PAGE rows line up, and a wrapped second row of signals sits under the first chip rather than under the label. Settings checkboxes are the app's own teal instead of browser blue. The sidebar's `New symbol` button is centred like the AI builder above it. In the device editor the IP row lines up with the port name above it. The legend's hop buttons no longer change size when you pick one, and the equipment list shows categories in caps like every other column."]},{date:"2026-09-29",items:["**Power connects whatever the two ends are, and the cable list says which lead.** A C13 outlet into a C14 inlet, a distro into a TRUE1 server, a DC brick \u2014 none of it is refused any more, because the lead always exists. What matters is which one, so the NOTE column specs it: `IEC C13-C14 JUMPER`, `IEC C13 TO TRUE1 LEAD`, `PSU / ADAPTER \xB7 IEC C13 TO DC`. Direction still applies \u2014 two inlets cannot feed each other \u2014 and Link\u2026 now treats every power port as one group, so a rack of mixed connectors cables in one go.","**Link\u2026 can cable power.** Select a distro and the gear it feeds, and the connector list now offers `IEC MAINS`, wiring each free outlet to the next free inlet. It never appeared before because a distro outlet is IEC C13 and a device inlet is C14: two unrelated connectors as far as the planner was concerned, so neither had both an output and an input to pair. Cables whose ends differ are now grouped by family, which also fixes RJ45 to etherCON, USB A-to-B and mixing 12G with 3G SDI in the same run.","**Ctrl+Alt shortcuts no longer double up.** `Ctrl+Alt+V` was toggling the video ghost *and* pasting the clipboard; the same overlap hit `Ctrl+Alt+F` (fit), `Ctrl+Alt+N` (note tool), `Ctrl+Alt+C` (collapse) and `Ctrl+Alt+A` (select all). The ghost mnemonics are now their own thing, and the ordinary Ctrl and bare-key shortcuts ignore anything held with Alt.","**Ghosted kit is properly out of the way.** Dragging a marquee, or Ctrl+A, no longer picks up equipment the ghost filter has faded. If you cannot see it you cannot select it, so it cannot be moved or deleted by accident either.","**USB never blocks on direction.** A USB socket is a socket: two ports that both read IN will still take a lead between them. The arrows stay on the drawing where they mean something \u2014 which way video or power flows on a USB-C port, or NovaStar cascade order \u2014 they just no longer stop you cabling. While checking that: NovaStar cascade **USB IN is a Type-B socket and USB OUT is Type-A**, per the VX1000 spec, so the VX1000, VX600 and MCTRL4K now say so.","**USB cables just work.** USB-A, USB-B and USB-C now connect to each other \u2014 an A-to-B or A-to-C lead is an ordinary cable, not a converter, and the app was wrongly asking for one. **USB-B** is a connector type in its own right now, so the ports that really are type B \u2014 the Taurus UCX host ports, the VINX service port \u2014 are drawn and listed as USB-B, and the cable list names both ends so the right lead gets ordered. USB-C into an HDMI or DisplayPort input is allowed too, flagged as needing that cable. Thanks to the beta user who reported it."]},{date:"2026-09-28",items:["**What's new, in the app.** This panel. The status bar carries a dot until the newest entry has been read, and the full history is a page on the site.","**Ghost sheets.** `Alt+1` \u2026 `Alt+6` \u2014 or `Ctrl+Alt+V/F/N/A/C/P` \u2014 fades everything that is not carrying that signal, so a busy sheet becomes just the network, or just the video. They stack, `Esc` clears, and alt-clicking a legend row does the same. A chip top-left names the filter.","**It follows the signal through the kit.** A fibre run is never a service of its own, so it carries whatever the box at its end terminates: focusing VIDEO keeps the fibre between a TX and an RX, focusing NETWORK keeps a fibre trunk carrying the LAN. An RJ45 is read off its port name \u2014 AV, TPS, TPX, SDVoE and NDI ports are an AV stream, DANTE is audio, plain LAN stays the network \u2014 so an AV-over-IP chain shows encoder, switch and decoder without the rest of the LAN lighting up. PoE counts as power.","**Export and save by signal.** The Export menu has a SIGNAL row: tick what you want and it drives the SVG, the Print/PDF and a new **project copy** holding only those cables and the equipment they touch. A normal Save now remembers the view you were in, without removing anything from the file.","**Lightware, in full** \u2014 52 symbols. MX2 matrices including the audio and redundant frames and the DH DisplayPort hybrids, Taurus UCX across its generations, MMX multiport switchers, TPS / TPX / OPTX extenders, VINX, Gemini GVN and UBEX. Ports come from Lightware's own per-model port diagrams.","**openGear frames.** Ross OGX-FR and AJA OG-X-FR with an 18-card catalogue from AJA, Cobalt Digital and Ross. Cards are listed as card + rear-module pairings, because in openGear the rear module is what decides the connectors.","**Power everywhere.** Every symbol that takes mains now has an inlet, DC and 4-pin XLR are proper connector types, and the demo sheet ships with a 12-way distro cabled to everything. One fix worth naming: the disguise EX 3 was drawn with dual IEC \u2014 the whole VX/GX/EX range is a single powerCON TRUE1."]},{date:"2026-09-25",items:["**VLAN subnets and automatic IPs.** Give a VLAN a subnet and, with the setting on, anything you patch to it gets the next free address \u2014 shown under the symbol name, or under the port itself when a box has several LAN connections. Switches are skipped, and the VLAN is taken from either end of the cable.",'**Your VLAN scheme persists.**
